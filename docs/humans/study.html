<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universe 69 — figure study</title>
<style>
  html, body { margin: 0; height: 100%; background: #14120e; color: #e9dfc8;
    font: 13px/1.4 "Jost", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; color: inherit; background: #26221a; border: 1px solid #4a4232;
    padding: 4px 9px; border-radius: 3px; cursor: pointer; }
  button[aria-pressed="true"] { background: #4a4232; }
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="view"></canvas>
<script type="importmap">{"imports":{"three":"../three.module.min.js"}}</script>
<script type="module">
// Every body the record can describe, in every pose the viewer uses. A
// workbench page: it reads no record and draws no world.
import * as THREE from '../three.module.min.js';
import { loadHumans, makeFigure } from '../humans.js';

const ACTS = { stand: 0, walk: 1, forage: 2, fish: 4, build: 6, talk: 7, sleep: 17,
  eat: 12, groom: 21, withdraw: 13, fight: 14, rite: 16, watch: 20 };
const BODIES = [
  { label: 'man', sex: 0, age: 30, bmi: 22, sn: 6 },
  { label: 'woman', sex: 1, age: 28, bmi: 22, sn: 5 },
  { label: 'heavy', sex: 0, age: 45, bmi: 31, sn: 4 },
  { label: 'starving', sex: 1, age: 25, bmi: 15.5, sn: 3 },
  { label: 'strong', sex: 0, age: 24, bmi: 23, sn: 10 },
  { label: 'elder', sex: 1, age: 68, bmi: 21, sn: 3 },
  { label: 'child 9', sex: 0, age: 9, bmi: 17, sn: 3 },
  { label: 'child 4', sex: 1, age: 4, bmi: 16, sn: 2 },
];
const LOOKS = [
  { dress: 'hide', cloth: 0x8a6238 }, { dress: 'swim', cloth: 0x3f8fd0 },
  { dress: 'hide', cloth: 0x8a6238 }, { dress: 'hide', cloth: 0x8a6238 },
  { dress: 'fur', cloth: 0xa07850 }, { dress: 'hide', cloth: 0x8a6238 },
  { dress: 'hide', cloth: 0x8a6238 }, { dress: 'swim', cloth: 0xe8584a }];

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14120e);
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
const params = new URLSearchParams(location.search);
scene.add(new THREE.HemisphereLight(0xf4ead2, 0x3a3226, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(3, 6, 5); sun.castShadow = true;
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20),
  new THREE.MeshStandardMaterial({ color: 0x5f6e44, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

let act = params.get('act') || 'stand';
let figures = [];
const bar = document.getElementById('bar');
Object.keys(ACTS).forEach((k) => {
  const b = document.createElement('button');
  b.textContent = k; b.setAttribute('aria-pressed', k === act);
  b.onclick = () => { act = k; [...bar.children].forEach((x) => x.setAttribute('aria-pressed', x === b)); };
  bar.appendChild(b);
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const span = BODIES.length * 1.15;
  camera.position.set(0, 1.4, Math.max(6, span / 2 / Math.tan(15 * Math.PI / 180) / camera.aspect * 1.05));
  camera.lookAt(0, .85, 0);
  const at = params.get('at');            // ?at=2 closes in on one body
  if (at !== null) {
    const x = (+at - (BODIES.length - 1) / 2) * 1.15;
    camera.position.set(x + .6, 1.25, 2.6); camera.lookAt(x, .9, 0);
    if (params.has('top')) { camera.position.set(x, 6, .01); camera.lookAt(x, 0, 0); }
  }
}
addEventListener('resize', resize); resize();

await loadHumans();
BODIES.forEach((b, i) => {
  const a = { ...b, id: 11 + i * 7, yaw: 0, px: 0, py: 0 };
  const f = makeFigure(a, { ...LOOKS[i], grey: a.age >= 60, hairColor: [0x3b2416, 0x1d1510, 0x6b3a1e][i % 3] });
  f.root.position.x = (i - (BODIES.length - 1) / 2) * 1.15;
  scene.add(f.root);
  figures.push({ f, a });
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(.05, clock.getDelta());
  figures.forEach(({ f, a }) => {
    a.act = ACTS[act]; a.moving = act === 'walk'; a.speed = 1.3;
    a.yaw = act === 'sleep' ? Math.PI / 2 : 0;   // sleepers lie across the row, not along it
    const H = 1.72 * (a.age < 12 ? (a.age < 6 ? .67 : .78) : a.sex ? .93 : 1);
    f.pose(a, H, dt);
    f.ground(0, scene);
  });
  renderer.render(scene, camera);
});
</script>
</body>
</html>
