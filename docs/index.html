<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>UNIVERSE 69</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:#000; color:#d8d8e8; font-family:Menlo,Monaco,monospace;
         display:flex; flex-direction:column; }
  #worlds { flex:2; display:flex; min-height:0; }
  .world { flex:1; position:relative; min-width:0; }
  #divider { width:2px; background:#3a3a55; }
  canvas.view { width:100%; height:100%; display:block; image-rendering:pixelated; }
  .hud { position:absolute; top:0; left:0; right:0; padding:6px 10px;
         font-size:11px; line-height:1.5; white-space:pre-wrap;
         background:rgba(0,0,10,0.55); pointer-events:none; }
  .hud b { color:#f8d848; font-weight:bold; }
  #god { flex:1; border-top:2px solid #3a3a55; display:flex; min-height:0;
         background:#07070e; }
  .stat { width:25%; padding:8px 12px; font-size:11px; line-height:1.7;
          overflow:hidden; white-space:pre-wrap; }
  .stat h2 { font-size:11px; margin-bottom:2px; letter-spacing:1px; }
  #s6 h2 { color:#a8c0f0; } #s9 h2 { color:#a0e898; }
  .trend { width:100%; height:44px; image-rendering:pixelated; display:block;
           margin:4px 0; }
  #records { flex:1; padding:8px 14px; font-size:11px; line-height:1.85;
             overflow:hidden; border-left:2px solid #3a3a55;
             border-right:2px solid #3a3a55; }
  #records h2 { font-size:11px; color:#f8d848; letter-spacing:2px; margin-bottom:2px; }
  #records .cur::after { content:"▼"; color:#f8d848; margin-left:6px;
                         animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .ev6 { color:#a8c0f0; } .ev9 { color:#a0e898; } .evy { color:#666a88; }
  .dim { color:#8888aa; }
  /* phone: worlds stacked, the Record first, stats in two columns */
  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    #worlds { flex-direction:column; }
    #divider { width:auto; height:2px; }
    #god { flex-direction:row; flex-wrap:wrap; overflow-y:auto; }
    #records { flex:1 1 100%; order:0; border-left:none; border-right:none;
               border-bottom:2px solid #3a3a55; min-height:120px; }
    .stat { width:50%; order:1; font-size:10px; line-height:1.6; }
    .hud { font-size:10px; padding:4px 8px; }
  }
</style>
</head>
<body>
<div id="worlds">
  <div class="world"><canvas id="c6" class="view"></canvas>
    <div class="hud" id="hud6"><b>UNIVERSE 6 · EDEN</b></div></div>
  <div id="divider"></div>
  <div class="world"><canvas id="c9" class="view"></canvas>
    <div class="hud" id="hud9"><b>UNIVERSE 9 · LAGOON</b></div></div>
</div>
<div id="god">
  <div class="stat" id="s6"></div>
  <div id="records"><h2>THE OBSERVER'S RECORD</h2><div id="reclines"></div></div>
  <div class="stat" id="s9"></div>
</div>

<script src="config.js"></script>
<script>
var SNAP = window.SNAPSHOT_URL || null;
var PX = 12, U = PX/4;   // 12 offscreen pixels per world tile, art unit U

var P = {
  grass:"#4a9a44", flower:"#e8e060",
  forest:"#2a6830", canopy:"#1d4f24", trunk:"#5c3a1e",
  water:"#2860b8", foam:"#9cc4ee",
  sand:"#d8c070", pebble:"#b09850",
  farm:"#8a6530", farmrow:"#6e4e1c",
  hutwall:"#8a5a30", hutroof:"#b03828", hutroof2:"#7c2418", hutdoor:"#301808",
  floor:"#ccc3b1", floorline:"#bcb3a1", wall:"#5a4e40", walltop:"#71634f",
  hopper:"#e8c040", pellet:"#a07c18", trough:"#4a90d9",
  child:"#f8e060", man:"#5080e0", woman:"#e87098", elder:"#aaaaaa",
  withdrawn:"#90f0e8", skin:"#f8d8b0", shadow:"rgba(0,0,0,0.3)"
};
var CLS = [P.child, P.man, P.woman, P.elder, P.withdrawn];

function hash2(x,y){ var h=(x*374761393+y*668265263)>>>0;
  h=(h^(h>>13))*1274126177>>>0; return (h^(h>>16))/4294967295; }
function lerp(a,b,t){ return a+(b-a)*t; }
function fetchJSON(u){ return fetch(u,{cache:"no-store"}).then(function(r){ return r.json(); }); }

var worldInfo=null, lagoonIter=-1, state=null, tick=0;
var EM=12;  // EDEN resort margin: the pen sits inside a themed resort
var off6=document.createElement("canvas"), off9=document.createElement("canvas");
off6.width=off6.height=(48+2*EM)*PX; off9.width=off9.height=160*PX;
var cam={ e:{x:24+EM,y:24+EM,h:9}, l:{x:137,y:109,h:9} };

// ---- tiles: uniform bases, sparse clear decorations (no confetti) -------
function T(ctx,x,y,c){ ctx.fillStyle=c; ctx.fillRect(x*PX,y*PX,PX,PX); }

function paintLagoonBase(ctx, terrain, t){
  var S=terrain.length;
  if (off9.width!==S*PX){ off9.width=off9.height=S*PX; }
  for (var y=0;y<S;y++) for (var x=0;x<S;x++){
    var k=terrain[y][x];
    if (k===2){
      T(ctx,x,y,P.water);
      if ((x*7+y*13+(t>>3))%31===0){ ctx.fillStyle=P.foam;
        ctx.fillRect(x*PX+((x+t>>2)%3)*U, y*PX+U, 2*U, U); }
    } else if (k===1){
      T(ctx,x,y,P.forest);
    } else if (k===3){
      T(ctx,x,y,P.sand);
      if (hash2(x,y)>0.93){ ctx.fillStyle=P.pebble; ctx.fillRect(x*PX+U,y*PX+2*U,U,U); }
    } else {
      T(ctx,x,y,P.grass);
      if (hash2(x,y)>0.95){ ctx.fillStyle=P.flower; ctx.fillRect(x*PX+2*U,y*PX+U,U,U); }
    }
  }
  // distinct trees on a sparse lattice over forest
  for (var y=1;y<S-1;y++) for (var x=1;x<S-1;x++){
    if (terrain[y][x]===1 && hash2(x*3,y*5)>0.82){
      ctx.fillStyle=P.canopy; ctx.fillRect(x*PX-U, y*PX-2*U, PX+2*U, PX);
      ctx.fillRect(x*PX, y*PX-3*U, PX, U);
      ctx.fillStyle=P.trunk; ctx.fillRect(x*PX+U, y*PX+PX-3*U, 2*U, 2*U);
    }
  }
}
function paintFarm(ctx,x,y){
  T(ctx,x,y,P.farm);
  ctx.fillStyle=P.farmrow;
  ctx.fillRect(x*PX,y*PX+U,PX,U); ctx.fillRect(x*PX,y*PX+3*U,PX,U);
}
function paintHut(ctx,x,y){
  ctx.fillStyle=P.hutwall; ctx.fillRect(x*PX+U,y*PX+3*U,PX*2-2*U,PX+U);
  ctx.fillStyle=P.hutroof; ctx.fillRect(x*PX,y*PX+U,PX*2,2*U);
  ctx.fillStyle=P.hutroof2; ctx.fillRect(x*PX+U,y*PX,PX*2-2*U,U);
  ctx.fillStyle=P.hutdoor; ctx.fillRect(x*PX+PX-U,y*PX+PX+U,2*U,3*U);
}
function paintEdenBase(ctx,t){
  // The pen sits inside a themed resort — the zoom-out is the Truman reveal:
  // manicured lawn, palms, a pool nobody in the pen will ever see.
  var S=48, W=S+2*EM;
  ctx.fillStyle="#58a850"; ctx.fillRect(0,0,W*PX,W*PX);          // lawn
  for (var i=0;i<W;i+=3){                                         // mow lines
    ctx.fillStyle="#52a04a"; ctx.fillRect(i*PX,0,PX,W*PX);
  }
  for (var py=2;py<W-2;py+=5) for (var px=2;px<W-2;px+=5){        // palms
    if ((px<EM-2||px>W-EM+0||py<EM-2||py>W-EM+0) && hash2(px,py)>0.55){
      ctx.fillStyle=P.trunk; ctx.fillRect(px*PX+U,py*PX+U,2*U,2*U);
      ctx.fillStyle="#2f7a38";
      ctx.fillRect(px*PX-U,py*PX-U,PX+U,U); ctx.fillRect(px*PX,py*PX-2*U,U,U);
      ctx.fillRect(px*PX-2*U,py*PX,U,U); ctx.fillRect(px*PX+PX,py*PX,U,U);
    }
  }
  ctx.fillStyle="#38b8e0";                                        // the pool
  ctx.fillRect(3*PX,3*PX,6*PX,4*PX);
  ctx.fillStyle=P.foam; ctx.fillRect(4*PX,4*PX,2*U,U); ctx.fillRect(7*PX,5*PX,2*U,U);
  ctx.fillStyle="#e8e8e0";                                        // resort fence
  ctx.fillRect((EM-2)*PX,(EM-2)*PX,(S+4)*PX,U);
  ctx.fillRect((EM-2)*PX,(S+EM+2)*PX-U,(S+4)*PX,U);
  ctx.fillRect((EM-2)*PX,(EM-2)*PX,U,(S+4)*PX);
  ctx.fillRect((S+EM+2)*PX-U,(EM-2)*PX,U,(S+4)*PX);
  ctx.save();
  ctx.translate(EM*PX, EM*PX);
  ctx.fillStyle=P.floor; ctx.fillRect(0,0,S*PX,S*PX);
  ctx.fillStyle=P.wall;
  ctx.fillRect(0,0,S*PX,PX*2); ctx.fillRect(0,(S-2)*PX,S*PX,PX*2);
  ctx.fillRect(0,0,PX*2,S*PX); ctx.fillRect((S-2)*PX,0,PX*2,S*PX);
  ctx.fillStyle=P.walltop; ctx.fillRect(0,0,S*PX,2*U); ctx.fillRect(0,0,2*U,S*PX);
  // nest boxes along each wall, entrances facing the floor
  for (var i=4;i<S-6;i+=5){
    [[i,2,0,1],[i,S-4,0,-1],[2,i,1,0],[S-4,i,-1,0]].forEach(function(b){
      var bx=b[0],by=b[1];
      ctx.fillStyle=P.floorline; ctx.fillRect(bx*PX,by*PX,PX*2,PX*2);
      ctx.fillStyle=P.wall;
      ctx.fillRect(bx*PX,by*PX,PX*2,U); ctx.fillRect(bx*PX,by*PX,U,PX*2);
      ctx.fillRect(bx*PX,(by+2)*PX-U,PX*2,U); ctx.fillRect((bx+2)*PX-U,by*PX,U,PX*2);
      ctx.fillStyle=P.hutdoor;   // entrance hole on the floor side
      ctx.fillRect((bx+1)*PX-U+b[2]*PX, (by+1)*PX-U+b[3]*PX, 2*U, 2*U);
    });
  }
  // four hopper stations + water
  [[8,8],[S-10,8],[8,S-10],[S-10,S-10]].forEach(function(h){
    ctx.fillStyle=P.hopper; ctx.fillRect(h[0]*PX,h[1]*PX,PX*2,PX*2);
    ctx.fillStyle=P.pellet; ctx.fillRect(h[0]*PX+2*U,h[1]*PX+2*U,2*U,U);
    ctx.fillRect(h[0]*PX+5*U,h[1]*PX+5*U,2*U,U);
  });
  for (var i=0;i<6;i++){ var wx=(48>>1)-3+i;
    T(ctx,wx,2,P.trough);
    if ((wx+(t>>3))%3===0){ ctx.fillStyle=P.foam; ctx.fillRect(wx*PX+U,2*PX+U,U,U); } }
  ctx.restore();
}
function paintPerson(ctx,p,t){
  var x=p[0]*PX, y=p[1]*PX, c=CLS[p[2]];
  var bob=((p[0]*31+p[1]*17+(t>>4))%2)*U;
  var w = p[2]===0 ? 2*U : 3*U;            // children are smaller
  ctx.fillStyle=P.shadow; ctx.fillRect(x,y+3*U,w,U);
  ctx.fillStyle="rgba(0,0,0,0.35)";        // soft outline for readability
  ctx.fillRect(x-1,y+U-bob-1,w+2,2*U+2);
  ctx.fillStyle=c; ctx.fillRect(x,y+U-bob,w,2*U);
  ctx.fillStyle=P.skin; ctx.fillRect(x+(w>>1)-(U>>1),y-U-bob,U,U);
}

// ---- camera + blit (aspect-correct) -------------------------------------
function render(canvas, offc, u, key, st){
  var ctx=offc.getContext("2d");
  if (key==="e") paintEdenBase(ctx,tick);
  else {
    var terrain = SNAP ? (st.world&&st.world.terrain) : (worldInfo&&worldInfo.terrain);
    if (!terrain) return;
    paintLagoonBase(ctx,terrain,tick);
    var TS=terrain.length;
    (u.farms||[]).forEach(function(f){
      if (f[0]>0&&f[0]<TS-1&&f[1]>0&&f[1]<TS-1) paintFarm(ctx,f[0],f[1]); });
    (u.settlements||[]).forEach(function(s){ paintHut(ctx,s.x-1,s.y-1); });
  }
  var ox = key==="e" ? EM : 0;   // pen coordinates sit inside the resort
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  u.people.forEach(function(p){
    paintPerson(ctx,[p[0]+ox,p[1]+ox,p[2]],tick);
    if(p[0]+ox<minx)minx=p[0]+ox; if(p[0]+ox>maxx)maxx=p[0]+ox;
    if(p[1]+ox<miny)miny=p[1]+ox; if(p[1]+ox>maxy)maxy=p[1]+ox;
  });
  var S=offc.width/PX, c=cam[key==="e"?"e":"l"];
  var tx,ty,th;
  if (u.people.length){
    tx=(minx+maxx)/2; ty=(miny+maxy)/2;
    th=Math.max(8, Math.min(S/2, Math.max(maxx-minx,maxy-miny)/2+7));
  } else { tx=S/2; ty=S/2; th=S/2; }
  c.x=lerp(c.x,tx,0.04); c.y=lerp(c.y,ty,0.04); c.h=lerp(c.h,th,0.04);
  var aspect=canvas.width/canvas.height;
  var hy=c.h, hx=Math.min(S/2, c.h*aspect);
  if (hx/aspect<hy) hy=hx/aspect;
  var sx=Math.max(0,Math.min(S-2*hx,c.x-hx)), sy=Math.max(0,Math.min(S-2*hy,c.y-hy));
  var g=canvas.getContext("2d");
  g.imageSmoothingEnabled=false;
  g.fillStyle="#000"; g.fillRect(0,0,canvas.width,canvas.height);
  g.drawImage(offc, sx*PX, sy*PX, 2*hx*PX, 2*hy*PX, 0, 0, canvas.width, canvas.height);
}

// ---- god panel ----------------------------------------------------------
function sparkline(id, census, color){
  var cv=document.getElementById(id);
  if (!cv || !census || census.length<2) return;
  var g=cv.getContext("2d"), W=cv.width=cv.clientWidth||200, H=cv.height=44;
  g.fillStyle="#07070e"; g.fillRect(0,0,W,H);
  var max=1; census.forEach(function(r){ if(r[1]>max)max=r[1]; });
  var n=census.length, bw=Math.max(1,Math.floor(W/n));
  g.fillStyle=color;
  for (var i=0;i<n;i++){
    var h=Math.max(1,Math.round(census[i][1]/max*(H-4)));
    g.fillRect(i*bw, H-h, Math.max(1,bw-1), h);
  }
}
function statHTML(u, kind){
  var out="<h2>UNIVERSE "+(kind==="e"?"6 · EDEN":"9 · LAGOON")+"</h2>";
  out+="ITERATION "+u.iter+" · YEAR "+u.year+"\n";
  out+="POP "+u.pop+" · PEAK "+u.peak+" · GEN "+u.gen+"\n";
  out+="<canvas id='tr"+kind+"' class='trend'></canvas>";
  if (kind==="e"){
    out+="PHASE: "+u.phase.toUpperCase();
    if (u.std) out+="\n<span class='dim'>OUTBREAK IN THE PEN</span>";
    if (u.ennui>0.2) out+="\n<span class='dim'>ENNUI "+Math.round(u.ennui*100)+"%</span>";
  } else {
    var age=u.tech&&u.tech.length?("AGE OF "+u.tech[u.tech.length-1].replace("_"," ").toUpperCase()):u.phase.toUpperCase();
    out+=age+" · TRIBES "+((u.settlements||[]).length)+" · STORE "+Math.round(u.store||0);
    if (u.lessons&&u.lessons.length) out+="\n<span class='dim'>INSTINCTS: "+u.lessons.join(" · ").toUpperCase()+"</span>";
    if (u.culture&&u.culture.length) out+="\n<span class='dim'>ARTS: "+u.culture.length+" — "+u.culture[u.culture.length-1].toUpperCase()+"</span>";
  }
  return out;
}
function hudText(u, kind){
  var l2 = kind==="e" ? u.phase.toUpperCase()
    : (u.tech&&u.tech.length?"AGE OF "+u.tech[u.tech.length-1].replace("_"," ").toUpperCase():u.phase.toUpperCase());
  return "<b>UNIVERSE "+(kind==="e"?"6 · EDEN":"9 · LAGOON")+"</b>  Y"+u.year+" · POP "+u.pop+" · "+l2;
}

var typeFull="", typePos=0, shown=[];
function updateRecords(events){
  var el=document.getElementById("reclines");
  if (!events||!events.length){ el.innerHTML="<span class='dim'>Nothing yet. The worlds are young.</span>"; return; }
  var last=events[events.length-1], key=last.d+last.msg;
  if (typeFull!==key){ typeFull=key; typePos=0; shown=events.slice(-7,-1); }
  typePos=Math.min(last.msg.length, typePos+2);
  function row(e,cur){
    var cls=e.u==="EDEN"?"ev6":"ev9";
    return "<div class='"+cls+(cur?" cur":"")+"'><span class='evy'>Y"+e.y+" "
      +(e.u==="EDEN"?"U6":"U9")+"</span> "+(cur?last.msg.slice(0,typePos):e.msg)+"</div>";
  }
  el.innerHTML=shown.map(function(e){return row(e,false);}).join("")+row(last,true);
}

function fit(){
  var dpr=Math.min(window.devicePixelRatio||1, 3);
  ["c6","c9"].forEach(function(id){
    var cv=document.getElementById(id);
    cv.width=Math.round(cv.clientWidth*dpr);
    cv.height=Math.round(cv.clientHeight*dpr);
  });
}
window.addEventListener("resize", fit);

function loadWorld(){
  if (SNAP) return Promise.resolve();
  return fetchJSON("/world").then(function(w){ worldInfo=w; lagoonIter=w.lagoon_iter; });
}
function poll(){
  (SNAP?fetchJSON(SNAP):fetchJSON("/state")).then(function(st){
    state=st;
    if (!SNAP&&worldInfo&&st.u.lagoon.iter!==lagoonIter) loadWorld();
    var e=st.u.eden,l=st.u.lagoon;
    var extra="";
    if (st.status&&st.status.catching_up) extra="  ·  FAST-FORWARDING "+st.status.behind_days+" DAYS";
    else if (SNAP) extra="  ·  MIRROR "+new Date(st.wall*1000).toLocaleTimeString();
    document.getElementById("hud6").innerHTML=hudText(e,"e")+extra;
    document.getElementById("hud9").innerHTML=hudText(l,"l");
    document.getElementById("s6").innerHTML=statHTML(e,"e");
    document.getElementById("s9").innerHTML=statHTML(l,"l");
    sparkline("tre", e.census, "#a8c0f0");
    sparkline("trl", l.census, "#a0e898");
  }).catch(function(){});
}
function frame(){
  tick++;
  if (state){
    render(document.getElementById("c6"), off6, state.u.eden, "e", state);
    render(document.getElementById("c9"), off9, state.u.lagoon, "l", state);
    if (tick%3===0) updateRecords(state.events);
  }
  setTimeout(function(){ requestAnimationFrame(frame); }, 100);
}
fit();
loadWorld().then(function(){ poll(); setInterval(poll,2000); frame(); });
</script>
</body>
</html>
