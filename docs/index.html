<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>UNIVERSE 69</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='8' height='16' fill='%23a8c0f0'/><rect x='8' width='8' height='16' fill='%23a0e898'/></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:#000; color:#d8d8e8; font-family:Menlo,Monaco,monospace;
         display:flex; flex-direction:column; }

  /* The instrument's own name and the only instruction the viewer needs.
     One line: a brand name does not earn a giant top bar. */
  #masthead { flex:0 0 auto; display:flex; align-items:baseline; gap:10px;
              padding:5px 12px; background:#0b0b14; font-size:11px;
              border-bottom:1px solid #26263c; }
  #masthead .ttl { color:#f8d848; letter-spacing:3px; font-weight:bold; }
  #masthead .sub { color:#8a8aa8; }
  #masthead .hint { margin-left:auto; color:#5e5e7c; letter-spacing:1px; white-space:nowrap;
                    overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #masthead .ttl, #masthead .sub { white-space:nowrap; }
  #walkbtn { font:inherit; font-size:10px; letter-spacing:1px; color:#9fe8c0;
             background:#12121e; border:1px solid #2f4a3c; padding:0 6px; cursor:pointer; }
  #walkbtn.on { color:#f8d848; border-color:#5a5a3a; }

  #worlds { flex:3 1 0; display:flex; min-height:0; }
  .world { flex:1; position:relative; min-width:0; overflow:hidden; }
  #divider { width:2px; background:#3a3a55; }
  canvas.view { width:100%; height:100%; display:block; image-rendering:pixelated; }
  canvas.overlay { position:absolute; inset:0; width:100%; height:100%;
                   pointer-events:none; }
  .hud { position:absolute; top:0; left:0; right:0; padding:6px 10px;
         font-size:11px; line-height:1.5; white-space:pre-wrap;
         background:rgba(0,0,10,0.55); pointer-events:none; }
  .hud b { color:#f8d848; font-weight:bold; }
  .hud .shot { color:#f0f0f8; letter-spacing:1px; }
  .hud .scale { color:#7a7a9c; }
  .hud .who { color:#9fe8c0; }

  /* the lower third: who you are watching */
  .card { position:absolute; left:0; bottom:0; max-width:70%;
          padding:6px 10px; font-size:11px; line-height:1.55;
          background:rgba(0,0,10,0.72); border-top:1px solid #2c2c46;
          pointer-events:none; display:none; }
  .card.on { display:block; }
  .card .nm { color:#f8d848; }
  .card .dl { color:#8a8aa8; }
  .card .dl b { color:#c8c8e0; font-weight:normal; }

  /* each world's numbers live on its own HUD; the arc of its population sits
     in the HUD's corner, because it is a fact about that world */
  .hud .now { color:#a8a8c4; }
  .hud .dim { color:#8888aa; }
  .trend { position:absolute; top:6px; right:10px; width:120px; height:14px;
           image-rendering:pixelated; pointer-events:none; }
  .hud .l1 { padding-right:130px; }
  .key { display:inline-block; width:7px; height:7px; border:2px solid;
         vertical-align:-1px; margin-right:3px; }

  /* the record: one strip, sized to five lines, taller only on request */
  #god { flex:0 0 auto; border-top:2px solid #3a3a55; background:#07070e; }
  #records { display:flex; flex-direction:column; min-width:0; }
  #rechead { flex:0 0 auto; padding:4px 12px 2px; display:flex; align-items:baseline; }
  #more { margin-left:auto; }
  #records h2 { font-size:11px; color:#f8d848; letter-spacing:2px;
                display:inline-block; }
  #filters { display:inline-flex; gap:4px; margin-left:10px; vertical-align:baseline; }
  #filters button, #more { font:inherit; font-size:10px; letter-spacing:1px;
                    color:#6a6a8a; background:#12121e; border:1px solid #26263c;
                    padding:1px 6px; cursor:pointer; }
  #filters button.on, #more.on { color:#f8d848; border-color:#5a5a3a; background:#1a1a16; }
  #reclines { height:calc(5 * 18px + 6px); overflow-y:auto; padding:0 12px 6px;
              font-size:11px; line-height:18px; }
  #god.tall #reclines { height:42vh; }
  #reclines::-webkit-scrollbar { width:8px; }
  #reclines::-webkit-scrollbar-thumb { background:#2c2c46; }
  #reclines .row { color:#b8b8d0; }
  #reclines .row .yr { color:#666a88; }
  #reclines .row .u6 { color:#a8c0f0; } #reclines .row .u9 { color:#a0e898; }
  #reclines .row.life { color:#c8c8e0; }
  #reclines .row.world { color:#a0a0c0; }
  #reclines .row.end { color:#f0b0b0; }
  #reclines .empty { color:#666a88; }
  #reclines .n { color:#f8d848; }

  .ev6 { color:#a8c0f0; } .ev9 { color:#a0e898; } .evy { color:#666a88; }
  .dim { color:#8888aa; }

  @media (max-width: 1200px) { .hud { font-size:10px; line-height:1.4; } }
  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    #masthead { flex-wrap:wrap; padding:4px 8px; gap:3px 8px; }
    #masthead .ttl { white-space:nowrap; }
    #masthead .sub { display:none; }
    #walkbtn { order:1; margin-left:auto; }
    #masthead .hint { order:2; margin-left:0; flex:1 1 100%; font-size:9px;
                      letter-spacing:0; white-space:nowrap;
                      overflow:hidden; text-overflow:ellipsis; }
    #worlds { flex-direction:column; flex:3 1 0; }
    #divider { width:auto; height:2px; }
    #reclines { font-size:10px; height:calc(4 * 18px + 6px); }
    .hud { font-size:9px; padding:3px 6px; }
    .hud .l1 { padding-right:70px; }
    .trend { width:60px; height:11px; top:4px; right:6px; }
    .card { font-size:10px; padding:4px 8px; max-width:100%; }
    #filters button, #more { font-size:9px; padding:1px 4px; }
    #records h2 .long { display:none; }
  }
</style>
</head>
<body>
<div id="masthead">
  <span class="ttl">UNIVERSE 69</span>
  <span class="sub">two sealed worlds — observed, never helped</span>
  <span class="hint">wheel zoom · drag pan · click to follow · WASD walk in · esc</span>
  <button id="walkbtn" title="Walk into the world you last touched">WALK</button>
</div>
<div id="worlds">
  <div class="world" id="w6"><canvas id="c6" class="view"></canvas>
    <canvas id="o6" class="overlay"></canvas>
    <div class="hud" id="hud6"><b>UNIVERSE 6 · EDEN</b></div>
    <canvas id="tre" class="trend"></canvas>
    <div class="card" id="card6"></div></div>
  <div id="divider"></div>
  <div class="world" id="w9"><canvas id="c9" class="view"></canvas>
    <canvas id="o9" class="overlay"></canvas>
    <div class="hud" id="hud9"><b>UNIVERSE 9 · LAGOON</b></div>
    <canvas id="trl" class="trend"></canvas>
    <div class="card" id="card9"></div></div>
</div>
<div id="god">
  <div id="records">
    <div id="rechead">
      <h2><span class='long'>THE OBSERVER'S </span>RECORD</h2>
      <span id="filters">
        <button data-u="all" class="on">ALL</button>
        <button data-u="EDEN">U6</button>
        <button data-u="LAGOON">U9</button>
        <button data-k="life">LIFE</button>
        <button data-k="world">WORLD</button>
        <button data-k="end">END</button>
      </span>
      <span id="filters2" class="filters"><button id="more">MORE</button></span>
    </div>
    <div id="reclines"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
var SNAP = window.SNAPSHOT_URL || null;
var PX = 12;          // offscreen pixels per world tile
var EM = 12;          // EDEN resort margin (tiles) around the pen

// ---- palette: muted, 3 tones per material, light from the north-west ----
var P = {
  waterD:"#1a4580", water:"#2559a3", waterS:"#3a78c8", waterL:"#5a94d8", foam:"#d4ecfa",
  sand:"#d4bc7a", sandL:"#e2cf96", sandD:"#b89c58", sandWet:"#b9a060",
  grass:"#4e8a3a", grassD:"#3f7230", grassL:"#6aa84e", grassX:"#2f5d26",
  floorF:"#2f5e28", canD:"#1b421b", can:"#2f6b2c", canL:"#4d8f3e", canX:"#6cab52",
  trunk:"#6b4226", trunkD:"#4e2f18",
  soil:"#8a6530", soilD:"#6e4e1c", soilL:"#a07a3e", path:"#a8946a",
  thatch:"#9a7a3a", thatchD:"#7c6028", thatchL:"#b8955a",
  hutwall:"#7a5a34", hutdoor:"#2c1a0c",
  stone:"#b4ac9c", stoneB:"#bcb4a4", mortar:"#978f80", dust:"#a8a092",
  wallTop:"#8a7f6c", wall:"#6a5f4e", wallFace:"#473d30", alcove:"#2e2619",
  hopper:"#e0b838", hopperD:"#b08a18", trough:"#4a90d9",
  lawn:"#55a04c", lawnD:"#4c9344", palm:"#2f7a38", palmL:"#3f9a48",
  pool:"#38b8e0", poolL:"#7cd8f0", rim:"#e8e8e0", deck:"#d8c9a0",
  shadow:"rgba(0,0,0,0.30)"
};

function hash2(x,y){ var h=(x*374761393+y*668265263)>>>0;
  h=(h^(h>>13))*1274126177>>>0; return (h^(h>>16))/4294967295; }
function lerp(a,b,t){ return a+(b-a)*t; }
function fetchJSON(u){ return fetch(u,{cache:"no-store"}).then(function(r){ return r.json(); }); }
function mkCanvas(w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h===undefined?w:h; return c; }

var worldInfo=null, lagoonIter=-1, state=null, tick=0, pollSeq=0;
// The camera is a documentary eye by default — but the viewer may take it.
//   auto   the eye chooses where to look and how close
//   manual you moved it: wheel to zoom, drag to pan
//   follow you picked a person and the camera stays with them
var cam={ e:{x:24+EM,y:24+EM,h:10,tx:24+EM,ty:24+EM,th:10,mode:"auto",follow:0},
          l:{x:137,y:109,h:10,tx:137,ty:109,th:10,mode:"auto",follow:0} };
var view={ e:null, l:null };      // the viewport each frame drew, for input maths
var sel={ e:0, l:0 };             // the person the viewer picked
var MIN_H=1.2, MAX_H=90;         // half-height in tiles: 1.2 is face-close
var hudCache={ e:"", l:"" };

// =========================================================== LAGOON layers
var base9=null, semi9=null, frame9=null, semi9seq=-1, water9=[], terr9=null;
var heat9=null, paths9=null, pathsSeq=-1;

function nIs(terrain,x,y,k){ var S=terrain.length;
  return x>=0&&y>=0&&x<S&&y<S&&terrain[y][x]===k; }
function nearLand(terrain,x,y,r){
  for (var dy=-r;dy<=r;dy++) for (var dx=-r;dx<=r;dx++){
    var k=terrain[y+dy]&&terrain[y+dy][x+dx];
    if (k!==undefined&&k!==2) return true;
  }
  return false;
}

function buildBase9(terrain){
  var S=terrain.length;
  base9=mkCanvas(S*PX); semi9=mkCanvas(S*PX); frame9=mkCanvas(S*PX);
  paths9=mkCanvas(S*PX); heat9=new Uint16Array(S*S);
  water9=[]; terr9=terrain;
  var g=base9.getContext("2d");
  for (var y=0;y<S;y++) for (var x=0;x<S;x++){
    var k=terrain[y][x], X=x*PX, Y=y*PX, h=hash2(x,y);
    if (k===2){ // water: shallows by the shore, deep blue beyond
      var sh = nearLand(terrain,x,y,1) ? P.waterS : nearLand(terrain,x,y,3) ? P.water : P.waterD;
      g.fillStyle=sh; g.fillRect(X,Y,PX,PX);
      if (h>0.74){ g.fillStyle=sh===P.waterD?"#163a6c":(sh===P.water?P.waterD:P.water); g.fillRect(X+2,Y+5,8,3); }
      if (nIs(terrain,x,y-1,0)||nIs(terrain,x,y-1,1)||nIs(terrain,x,y-1,3)){
        g.fillStyle=P.foam; g.fillRect(X,Y,PX,2); g.fillStyle=P.waterL; g.fillRect(X,Y+2,PX,1); }
      if (nIs(terrain,x,y+1,0)||nIs(terrain,x,y+1,1)||nIs(terrain,x,y+1,3)){
        g.fillStyle=P.foam; g.fillRect(X,Y+PX-2,PX,2); }
      if (nIs(terrain,x-1,y,0)||nIs(terrain,x-1,y,1)||nIs(terrain,x-1,y,3)){
        g.fillStyle=P.foam; g.fillRect(X,Y,2,PX); }
      if (nIs(terrain,x+1,y,0)||nIs(terrain,x+1,y,1)||nIs(terrain,x+1,y,3)){
        g.fillStyle=P.foam; g.fillRect(X+PX-2,Y,2,PX); }
      if (h>0.55) water9.push([x,y]);
    } else if (k===3){ // sand: grain, shells, a wet band along the waterline
      g.fillStyle=P.sand; g.fillRect(X,Y,PX,PX);
      g.fillStyle=P.sandL; g.fillRect(X+(h*9|0),Y+(h*5|0),2,1);
      g.fillStyle=P.sandD;
      g.fillRect(X+(h*6|0)+2,Y+(h*8|0),1,1); g.fillRect(X+(h*11|0),Y+(h*3|0)+6,2,1);
      if (hash2(x+5,y+9)>0.94){ g.fillStyle="#f0e6cc"; g.fillRect(X+4,Y+7,2,2); g.fillStyle="#c9b48a"; g.fillRect(X+5,Y+8,1,1); }
      g.fillStyle=P.sandWet;
      if (nIs(terrain,x,y-1,2)) g.fillRect(X,Y,PX,3);
      if (nIs(terrain,x,y+1,2)) g.fillRect(X,Y+PX-3,PX,3);
      if (nIs(terrain,x-1,y,2)) g.fillRect(X,Y,3,PX);
      if (nIs(terrain,x+1,y,2)) g.fillRect(X+PX-3,Y,3,PX);
    } else if (k===1){ // forest floor: leaf litter, shade
      g.fillStyle=P.floorF; g.fillRect(X,Y,PX,PX);
      if (h>0.5){ g.fillStyle=P.grassD; g.fillRect(X+(h*7|0),Y+(h*9|0),3,2); }
      if (hash2(x+3,y+11)>0.8){ g.fillStyle="#5c4a22"; g.fillRect(X+(h*8|0),Y+(h*6|0)+3,2,1); }
    } else { // grass: mottled, tufts, flowers, the odd stone
      g.fillStyle=P.grass; g.fillRect(X,Y,PX,PX);
      if (h>0.58){ g.fillStyle=P.grassD; g.fillRect(X+(h*6|0),Y+(h*8|0),5,3); }
      var t=hash2(x+17,y+3);
      if (t>0.80){ g.fillStyle=P.grassL;                      // a tuft
        var tx=X+(t*8|0), ty=Y+(t*6|0)+3;
        g.fillRect(tx,ty,1,3); g.fillRect(tx+2,ty-1,1,4); g.fillRect(tx+4,ty+1,1,2);
        g.fillStyle=P.grassX; g.fillRect(tx+1,ty+2,1,1); }
      if (hash2(x+9,y+4)>0.955){ g.fillStyle=(hash2(x,y+1)>0.5)?"#f0e070":"#f4f0f8"; g.fillRect(X+5,Y+4,2,2); g.fillStyle="#e0a040"; g.fillRect(X+6,Y+5,1,1); }
      if (hash2(x+21,y+13)>0.975){ g.fillStyle="#8e8a7e"; g.fillRect(X+3,Y+6,4,3); g.fillStyle="#b4b0a4"; g.fillRect(X+3,Y+6,3,1); }
    }
  }
  // trees: a long soft shadow to the south-east, then layered canopy
  for (var y=1;y<S-1;y++) for (var x=1;x<S-1;x++){
    if (terrain[y][x]===1 && hash2(x*3,y*5)>0.80){
      var X=x*PX, Y=y*PX;
      g.fillStyle="rgba(0,0,0,0.22)"; g.fillRect(X+1,Y+6,PX+10,6);
      g.fillStyle=P.trunkD; g.fillRect(X+5,Y+4,4,7);
      g.fillStyle=P.trunk;  g.fillRect(X+5,Y+4,2,7);
      g.fillStyle=P.canD;   g.fillRect(X-4,Y-6,PX+8,10);
      g.fillStyle=P.can;    g.fillRect(X-2,Y-8,PX+4,9);
      g.fillStyle=P.canL;   g.fillRect(X-1,Y-9,9,5);
      g.fillStyle=P.canX;   g.fillRect(X,Y-9,4,2);
    }
  }
}

function paintFarm9(g,x,y){
  var X=x*PX, Y=y*PX;
  g.fillStyle=P.soil; g.fillRect(X,Y,PX,PX);
  g.fillStyle=P.soilD;
  g.fillRect(X,Y+2,PX,2); g.fillRect(X,Y+6,PX,2); g.fillRect(X,Y+10,PX,2);
  g.fillStyle=P.soilL; g.fillRect(X,Y,PX,1);
  if (hash2(x,y)>0.4){ g.fillStyle=P.grassL; g.fillRect(X+3,Y+4,1,2); g.fillRect(X+8,Y+8,1,2); g.fillRect(X+6,Y+0,1,2); }
}
function paintHut9(g,x,y){
  var X=x*PX, Y=y*PX;
  g.fillStyle="rgba(0,0,0,0.24)"; g.fillRect(X+3,Y+PX+6,PX*2+4,PX-2);
  g.fillStyle=P.hutwall; g.fillRect(X+2,Y+PX+2,PX*2-4,PX-4);
  g.fillStyle="#5e4426"; g.fillRect(X+PX*2-6,Y+PX+2,4,PX-4);
  g.fillStyle=P.hutdoor; g.fillRect(X+PX-3,Y+PX+4,6,PX-6);
  g.fillStyle=P.thatch;  g.fillRect(X,Y+3,PX*2,PX);
  g.fillStyle=P.thatchD;
  g.fillRect(X,Y+6,PX*2,1); g.fillRect(X,Y+10,PX*2,1); g.fillRect(X,Y+PX+1,PX*2,2);
  g.fillStyle=P.thatchL; g.fillRect(X+2,Y+2,PX*2-4,2);
}
var boats9=[], snow9=null, snowKey="";
function buildPaths9(){
  // worn trails: where feet keep falling, the grass gives way to earth
  var S=terr9.length, g=paths9.getContext("2d");
  g.clearRect(0,0,S*PX,S*PX);
  for (var i=0;i<S*S;i++){
    var h=heat9[i]; if (h<30) continue;
    var x=i%S, y=(i/S)|0; if (terr9[y][x]===2) continue;
    var a=Math.min(0.85, (h-30)/260);
    g.fillStyle="rgba(168,148,106,"+a.toFixed(2)+")";
    g.fillRect(x*PX+1,y*PX+1,PX-2,PX-2);
    if (a>0.5){ g.fillStyle="rgba(120,100,66,"+(a*0.5).toFixed(2)+")"; g.fillRect(x*PX+4,y*PX+6,4,2); }
  }
}
function buildSemi9(u){
  var g=semi9.getContext("2d");
  g.drawImage(base9,0,0);
  if (paths9) g.drawImage(paths9,0,0);
  var S=terr9.length;
  (u.farms||[]).forEach(function(f){
    if (f[0]>0&&f[0]<S-1&&f[1]>0&&f[1]<S-1) paintFarm9(g,f[0],f[1]); });
  var walled = (u.tech||[]).indexOf("metallurgy")>=0;
  (u.settlements||[]).forEach(function(s){
    if (walled && s.r>=10){
      var r=s.r+1, X=(s.x-r)*PX, Y=(s.y-r)*PX, W=2*r*PX;
      g.fillStyle=P.wall;
      g.fillRect(X,Y,W,6); g.fillRect(X,Y+W-6,W,6);
      g.fillRect(X,Y,6,W); g.fillRect(X+W-6,Y,6,W);
      g.fillStyle=P.wallTop; g.fillRect(X,Y,W,2); g.fillRect(X,Y,2,W);
      g.fillStyle=P.hutdoor; g.fillRect(X+W/2-8,Y+W-6,16,6);
    }
    paintHut9(g,s.x-1,s.y-1);
  });
  boats9=[];
}
function snowAmount(x,y){
  // drifts are patchy: a coarse field decides where snow lies at all, a
  // finer one decides the ragged edge of each drift
  var coarse=hash2((x>>2)+17,(y>>2)+29);
  var fine=hash2(x*13+3,y*17+5);
  return coarse*0.72+fine*0.28;
}
function buildSnow9(harsh){
  var S=terr9.length;
  snow9=mkCanvas(S*PX);
  var g=snow9.getContext("2d");
  var reach=harsh?0.62:0.86;
  for (var y=0;y<S;y++) for (var x=0;x<S;x++){
    if (terr9[y][x]===2) continue;
    var amount=snowAmount(x,y)*reach;
    if (amount<=0.04) continue;
    // dither the tile in 3-pixel cells so the edge of a drift is ragged
    // rather than a square stamped on the grass
    for (var sy=0;sy<4;sy++) for (var sx=0;sx<4;sx++){
      if (hash2(x*4+sx+1, y*4+sy+1) >= amount) continue;
      g.fillStyle="rgba(238,244,252,0.82)";
      g.fillRect(x*PX+sx*3, y*PX+sy*3, 3, 3);
    }
  }
}

// =========================================================== EDEN layers
var base6=null, frame6=null, base6Key=null;
// The pen's default architecture, mirroring the engine's. The model sends the
// real list; this is only the fallback for a payload that predates it.
var EDEN_BOXES_FALLBACK=(function(){
  var out=[];
  for (var i=4;i<48-6;i+=5){
    out.push([i+1,4]); out.push([i+1,48-5]);
    out.push([4,i+1]); out.push([48-5,i+1]);
  }
  return out;
})();
// The alcove a nest box sits in: whichever wall the box is against.
function alcoveFor(b,S){
  var dN=b[1], dS=S-3-b[1], dW=b[0], dE=S-3-b[0];
  var m=Math.min(dN,dS,dW,dE);

      P.elbLx=3.2; P.elbLy=22.5; P.elbRx=4.6; P.elbRy=22.8; P.handLx=5.4; P.handLy=25; P.handRx=6; P.handRy=25.4; break; }
    case 102: { var gr2=Math.sin(ph);              // a beautiful one: grooming, alone

    case 103: { var br3=Math.sin(ph)*0.15;         // upstairs: sitting alone, looking out

      P.kneeLx=4.4; P.kneeLy=24.8; P.kneeRx=4.8; P.kneeRy=25.2; P.footLx=5.6; P.footLy=31.8; P.footRx=6.2; P.footRy=32;

      P.elbLx=2.4; P.elbLy=21; P.elbRx=4.6; P.elbRy=20; P.handLx=4.6; P.handLy=24.2; P.handRx=6.4; P.handRy=17;

// ---- the figure, drawn as a life-drawing sketch ------------------------------
// Ink over a flat wash of skin, the way a figure study is drawn: construction
// ovals for ribcage and pelvis, gesture lines for the limbs, and a second
// loose pass over the main lines. Realistic proportion — an adult is about
// seven and a half heads; a child's head is larger for its body.
//
// The body is the record. Width follows BMI, muscle follows strength, ribs
// show in famine, a belly shows obesity or pregnancy, a bandage and a limp
// mark an injury. Adults are drawn as bodies are; children are never given
// genital detail at any zoom.
var INK="#1d1812", INK_SOFT="rgba(29,24,18,0.32)", PAPER="#f4ead2";
var DRESS = { swim:["#e8584a","#3f8fd0","#f2c84a","#3fa58a","#d86aa8"],

function bodyOf(a){
  var b=a.bmi||22, age=(a.age===undefined)?30:a.age;

var STAGE_H=[0.42,0.64,0.88,1.0,0.97];       // height against an adult
var STAGE_HEAD=[1.55,1.28,1.08,1.0,1.0];     // head size against an adult's
var FAT_W=[0.66,0.8,1.0,1.24,1.55];           // torso width by BMI band

function drawSketch(g, cx, footY, s, act, c, moving, v, B, sex, dress, wk, view){
  var fem=(sex===1), adult=B.stage>=3, kid=B.stage<=1;
  // Sleeping, an infant, and two people making love are drawn lying down —
  // but only once they are there: nobody slides across the ground lying.
  // Lovemaking is shown as two adults lying together, nothing more explicit.
  var lying = !moving && (act===A_SLEEP || act===A_MATE || B.stage===0);
  view = moving ? (view||0) : 0;               // 0 profile, 1 coming toward us, 2 going away
  var private_ = (act===A_MATE || act===A_BIRTH);
  var poseAct = lying ? 0 : ((act===A_WITHDRAW && wk) ? 100+wk : act);
  var P=solvePose(poseAct, c, moving, v);
  // The pose solver's figure is long in the body and short in the leg. A
  // realistic adult is about 7.5 heads with the crotch near half height, so

    var y=P[f];

  var fw=FAT_W[B.fat], mus=B.strong&&B.stage>=2?1:0;

  var waW=(B.stage<2?2.3:fem?2.2:2.7)*fw;
  var hpW=(B.stage<2?2.4:fem?3.9:3.0)*Math.pow(fw,0.8);
  var limbW=(B.stage<2?1.5:fem?1.55:1.75)*Math.pow(fw,0.85)*(1+0.18*mus);
  if (view){                                    // walking toward or away: a front view
    var st2=Math.sin(c*Math.PI*2);
    P.lean=0; P.cx=0; P.headTilt=0; P.tool=0; P.basket=0; P.carry=0;
    P.footLx=-1.6; P.footRx=1.6; P.kneeLx=-1.5; P.kneeRx=1.5;
    P.footLy=32-Math.max(0,st2)*1.4; P.footRy=32-Math.max(0,-st2)*1.4;
    P.kneeLy=26-Math.max(0,st2)*1.2; P.kneeRy=26-Math.max(0,-st2)*1.2;

  function limb(x1,y1,x2,y2,w,col){            // a plain round-ended stroke (the neck)
    g.strokeStyle=INK; g.lineWidth=w+ink*2;

    g.strokeStyle=col; g.lineWidth=w;
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();

  // A limb as a figure drawer draws it: one contour from the root to the
  // extremity, tapering, the outer side bowed by the muscle beneath it.
  function bone(ax,ay,bx,by,cx2,cy2,w,col,leg){
    var w1=w*(leg?1.3:0.95), wk=w*(leg?0.72:0.68), w2=w*(leg?0.42:0.42);
    var b1=(leg?0.45*fw:0.25)+0.35*mus, b2=leg?0.38+0.2*mus:0.18;
    function nrm(x1,y1,x2,y2){ var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1; return [-dy/L, dx/L]; }
    var n1=nrm(ax,ay,bx,by), n2=nrm(bx,by,cx2,cy2);
    var nk=[(n1[0]+n2[0])/2,(n1[1]+n2[1])/2], nl=Math.hypot(nk[0],nk[1])||1; nk=[nk[0]/nl,nk[1]/nl];

    g.quadraticCurveTo(m1[0]-n1[0]*((w1+wk)/4+b1*0.3), m1[1]-n1[1]*((w1+wk)/4+b1*0.3), ax-n1[0]*w1/2, ay-n1[1]*w1/2);

    g.beginPath(); g.moveTo(ax+n1[0]*w1*0.62,ay+n1[1]*w1*0.62); g.quadraticCurveTo(bx+nk[0]*wk*0.7,by+nk[1]*wk*0.7,cx2+n2[0]*w2*0.6,cy2+n2[1]*w2*0.6); g.stroke();

      g.lineTo(hipX+hpW+0.6+belly*0.3, bot); g.lineTo(hipX-hpW-0.6, bot+0.6); g.closePath();
      g.fill(); g.stroke();
      g.strokeStyle=colD; g.lineWidth=ink*0.8;           // hatching: the hide's grain

    }
  }

  bone(hipX+hpW*0.45,P.hipY, X(P.kneeRx),P.kneeRy, X(P.footRx),P.footRy, limbW*1.65, legDress||SK, true);
  bone(shX+shW-0.6,P.shY+0.7, X(P.elbRx),P.elbRy, X(P.handRx),P.handRy, limbW*1.1, SK);
  if (mus && s>=2){                                       // the biceps' curve

    g.fillStyle="#f4f0e4"; g.strokeStyle=INK; g.lineWidth=ink*0.8;
    g.beginPath(); g.rect(bx-limbW*0.8, by-0.7, limbW*1.6, 1.4); g.fill(); g.stroke();

  if (B.fat===0){ g.strokeStyle=INK_SOFT; g.beginPath(); g.moveTo(hcx+hr*0.25,hcy+0.1); g.lineTo(hcx+hr*0.35,hcy+hr*0.55); g.stroke(); }  // hollow cheek

    g.beginPath(); g.arc(hcx+hr*0.32, hcy-0.1, 0.26, 0, 6.283); g.fill();
    g.strokeStyle=INK; g.lineWidth=ink*0.8;
    g.beginPath(); g.moveTo(hcx,hcy+0.2); g.lineTo(hcx+0.15,hcy+0.75); g.stroke();
    g.beginPath(); g.moveTo(hcx-0.4,hcy+1.2); g.lineTo(hcx+0.4,hcy+1.2); g.stroke();
  }

    g.fillStyle="#fbf8f0"; g.beginPath(); g.ellipse(hcx+hr*0.44, hcy-0.1, 0.55, 0.3, 0, 0, 6.283); g.fill();
    g.strokeStyle=INK; g.lineWidth=ink*0.6;
    g.beginPath(); g.arc(hcx-hr*0.05, hcy+0.1, hr*0.22, -1.2, 1.4); g.stroke();             // ear
    g.beginPath(); g.moveTo(hcx+hr*0.5,hcy+1.4); g.quadraticCurveTo(hcx+hr*0.62,hcy+1.6,hcx+hr*0.74,hcy+1.35); g.stroke();  // lower lip
    if (B.stage===4){ g.beginPath(); g.moveTo(hcx+hr*0.2,hcy+0.5); g.lineTo(hcx+hr*0.5,hcy+0.75); g.stroke(); }  // a line of age
  }
  if (s>=2.2){                                   // a face, looking where they face
    g.fillStyle=INK; g.beginPath(); g.arc(hcx+hr*0.42, hcy-0.1, s>=4?0.2:0.3, 0, 6.283); g.fill();
    g.strokeStyle=INK; g.lineWidth=ink*0.8;
    g.beginPath(); g.moveTo(hcx+hr*0.2,hcy-0.75); g.lineTo(hcx+hr*0.65,hcy-0.65); g.stroke();       // brow
    g.beginPath(); g.moveTo(hcx+hr*0.85,hcy+0.1); g.lineTo(hcx+hr*0.98,hcy+0.65); g.lineTo(hcx+hr*0.78,hcy+0.7); g.stroke();  // nose
    var sad = (act===A_WITHDRAW) ? 0.25 : 0;
    g.beginPath(); g.moveTo(hcx+hr*0.45,hcy+1.15); g.lineTo(hcx+hr*0.72,hcy+1.1+sad); g.stroke();  // mouth
  }
  g.restore();
}

// ---- sprite cache: one render per (pose, zoom), then a blit per person -----
var spriteCache={}, spriteCount=0;
function figureSprite(a, act, bucket, moving, s, dress){
  // Individual variation is only visible close up, so it only enters the
  // cache key when zoomed in; crowds share sprites and stay cheap. The key
  // fixes everything the drawing reads, so a cached figure is never someone
  // else's body.
  var sq = s>=2 ? Math.round(s) : Math.round(s*8)/8;
  var vk = s>=2 ? (a.v%20) : (s>=1.25 ? (a.v%4) : 0);
  var bk = s>=1.25 ? bucket : (bucket>>2);
  var B=bodyOf(a), wk=(act===A_WITHDRAW)?(a.wk||0):0;
  var view = !moving ? 0 : (Math.abs(a.vy||0)>1.2*Math.abs(a.vx||0) ? ((a.vy>0)?1:2) : 0);
  var key=act+"|"+B.stage+B.fat+B.strong+B.hurt+B.preg+"|"+a.sex+"|"+(dress||"")+"|"+wk+"|"+
          bk+"|"+(moving?1:0)+view+"|"+vk+"|"+sq;
  var sp=spriteCache[key];
  if (sp) return sp;
  var cap = sq>=3 ? 420 : 1400;
  if (spriteCount>cap){ spriteCache={}; spriteCount=0; }
  var W=Math.ceil(40*sq), H=Math.ceil(40*sq);
  var c=mkCanvas(W,H), g=c.getContext("2d");
  drawSketch(g, W/2, H-2*sq, sq, act, bucket/12+0.02, moving, vk, B, a.sex, dress, wk, view);
  sp={c:c, w:W, h:H, s:sq, view:view}; spriteCache[key]=sp; spriteCount++;
  return sp;
}

var shadowCache={};
function shadowSprite(ts){                      // one soft ellipse per zoom level
  var k=Math.round(ts*2); var s=shadowCache[k]; if (s) return s;
  var w=Math.max(3,Math.round(ts*0.9)), h=Math.max(2,Math.round(ts*0.36));
  var c=mkCanvas(w,h), g=c.getContext("2d");
  g.fillStyle="rgba(0,0,0,0.26)"; g.beginPath(); g.ellipse(w/2,h/2,w/2,h/2,0,0,6.283); g.fill();
  return (shadowCache[k]={c:c,w:w,h:h});
}

// ---- actors: the people keep living between observations ----------------
var actors6={}, actors9={};
function syncActors(map, people, ox, detail){
  var seen={};
  (people||[]).forEach(function(p,i){
    var id=p.length>4?p[4]:i, sex=p.length>3?p[3]:(p[2]===2?1:0);
    var act=p.length>5?p[5]:0, face=p.length>6?p[6]:1;
    seen[id]=1;
    var nx=p[0]+ox, ny=p[1]+ox;
    var a=map[id];
    if (!a){ map[id]=a={x:nx,y:ny,id:id,face:face,moving:false,v:(id*2654435761>>>0)%997}; }
    a.cls=p[2]; a.sex=sex; a.act=act; a.eface=face;
    if (p.length>11){ a.age=p[7]; a.bmi=p[8]; a.sn=p[9]; a.inj=p[10]; a.wk=p[11]; }
    var d=detail&&detail[String(id)]; a.preg=d?((d[3]&4)?1:0):0;
    a.tx=nx; a.ty=ny;
  });
  Object.keys(map).forEach(function(id){ if(!seen[id]) delete map[id]; });
}
// Movement. Each person is their own walker: when the record gives them a
// new place to be, they set off after their own small hesitation, at their
// own pace (age, build, injury, a little temperament), speed up and slow
// down instead of snapping, and their legs step in time with the ground
// they actually cover — so a crowd never marches in step.
function walkerOf(a){
  var h=((a.id*2654435761)>>>0)/4294967296;
  var age=a.age===undefined?30:a.age, b=a.bmi||22;
  var pace=0.042*(0.82+0.36*h);
  if (age<12) pace*=1.15; else if (age>=58) pace*=0.72;
  if (b>=30) pace*=0.82; if ((a.inj||0)>=5) pace*=0.6;
  return {pace:pace, stride:age<12?0.55:(age<16?0.75:0.9), ph0:h};
}
function updateActors(map, heat, S){
  Object.keys(map).forEach(function(id){
    var a=map[id];
    if (!a.wk_){ a.wk_=walkerOf(a); a.vx=a.vy=0; a.dist=a.wk_.ph0*a.wk_.stride; a.wait=0; }
    if (a.tx!==a.ltx || a.ty!==a.lty){              // a new place to be
      a.ltx=a.tx; a.lty=a.ty;
      a.wait=Math.floor(((a.id*7919+tick)%37)*0.9);  // nobody leaves on the same beat
    }
    var dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if (d>14){ a.x=a.tx; a.y=a.ty; a.vx=a.vy=0; d=0; }  // a move of camp: cut, don't glide
    var want=0;
    if (a.wait>0) a.wait--;
    else if (d>0.03) want=Math.max(a.wk_.pace, d/52)*Math.min(1, d/0.7);  // arrive within the day; ease in
    var ux=d>0?dx/d:0, uy=d>0?dy/d:0;
    a.vx+=(ux*want-a.vx)*0.12; a.vy+=(uy*want-a.vy)*0.12;  // no instant starts or stops
    var v=Math.hypot(a.vx,a.vy);
    if (d<=0.03 && v<0.004){ a.x=a.tx; a.y=a.ty; a.vx=a.vy=0; a.moving=false; a.face=a.eface||a.face; return; }
    a.x+=a.vx; a.y+=a.vy; a.dist+=v;
    a.moving=v>0.006;
    if (Math.abs(a.vx)>0.01) a.face=a.vx>0?1:-1;
    a.walkc=(a.dist/a.wk_.stride)%1;
    if (heat && (tick%6===0)){ var ix=Math.round(a.x), iy=Math.round(a.y);
      if (ix>=0&&iy>=0&&ix<S&&iy<S) heat[iy*S+ix]=Math.min(65000, heat[iy*S+ix]+2); }
  });
}

// ---- particles: smoke, leaves, birds, sparks — in world coordinates -------
var parts9=[], parts6=[], birds9=null;
function spawnParticles(u, key, sx, sy, hx, hy){
  var list = key==="l"?parts9:parts6;
  if (key==="l"){
    if ((u.tech||[]).indexOf("fire")>=0 && tick%5===0){
      (u.settlements||[]).forEach(function(s){
        if (s.x<sx-2||s.x>sx+2*hx+2||s.y<sy-2||s.y>sy+2*hy+2) return;
        list.push({t:0, x:s.x+2.3+Math.random()*0.3, y:s.y+1.1, vx:(Math.random()-0.5)*0.01+0.006, vy:-0.02-Math.random()*0.012, life:0, max:70+Math.random()*40});
      });
    }
    if (tick%9===0 && terr9){                                            // leaves in the woods
      for (var k=0;k<2;k++){
        var x=Math.floor(sx+Math.random()*2*hx), y=Math.floor(sy+Math.random()*2*hy);
        if (terr9[y]&&terr9[y][x]===1) list.push({t:1, x:x+Math.random(), y:y-0.6, vx:0.012+Math.random()*0.01, vy:0.016+Math.random()*0.01, life:0, max:80+Math.random()*50, r:Math.random()*6});
      }
    }
    if (!birds9 && Math.random()<0.0025){ birds9={x:sx-3, y:sy+Math.random()*hy*0.8, vx:0.07, n:5, life:0}; }
    if (birds9){ birds9.x+=birds9.vx; birds9.life++; if (birds9.x>sx+2*hx+6||birds9.life>900) birds9=null; }
  } else {
    if (tick%7===0 && Math.random()<0.3){                                 // dust from the floor
      var x2=sx+Math.random()*2*hx, y2=sy+Math.random()*2*hy;
      list.push({t:2, x:x2, y:y2, vx:(Math.random()-0.5)*0.01, vy:-0.004, life:0, max:50});
    }
  }
  for (var i=list.length-1;i>=0;i--){
    var p=list[i]; p.x+=p.vx; p.y+=p.vy; p.life++;
    if (p.t===0){ p.vx+=0.0008; p.vy*=0.985; }
    if (p.t===1){ p.vx=0.012+Math.sin(p.life*0.15+p.r)*0.012; }
    if (p.life>p.max) list.splice(i,1);
  }

}
function drawParticles(g, key, sx, sy, ts, W){
  var list = key==="l"?parts9:parts6;
  for (var i=0;i<list.length;i++){
    var p=list[i], f=p.life/p.max, X=(p.x-sx)*ts, Y=(p.y-sy)*ts;
    if (p.t===0){ var r=ts*(0.12+f*0.35); g.fillStyle="rgba(210,205,200,"+(0.38*(1-f)).toFixed(2)+")"; g.beginPath(); g.arc(X,Y,r,0,6.283); g.fill(); }
    else if (p.t===1){ var sw=ts*0.18, k=Math.abs(Math.sin(p.life*0.2+p.r)); g.fillStyle=(p.r>3)?"#c9a23a":"#8fb04a"; g.fillRect(X,Y,sw*(0.4+k),sw*0.55); }
    else { g.fillStyle="rgba(230,225,210,"+(0.18*(1-f)).toFixed(2)+")"; g.fillRect(X,Y,ts*0.2,ts*0.12); }
  }
  if (key==="l" && birds9){
    g.fillStyle="#1c1c22";
    for (var b=0;b<birds9.n;b++){
      var bx=(birds9.x-sx-b*0.9)*ts, by=(birds9.y-sy+Math.abs(b-2)*0.35)*ts, fl=Math.sin(tick*0.5+b)*ts*0.12;
      g.fillRect(bx-ts*0.18, by+fl, ts*0.18, 1.5); g.fillRect(bx, by, ts*0.18, 1.5);
    }

// ---- the camera: a documentary eye, not a surveillance map ---------------
// Every so often it finds something worth watching — a circle of talk, a
// hunting party in the woods, a birth, a brawl at the hopper, children at
// play — closes in on it for a while, then pulls back to the whole world.
var shots={ e:{until:0, x:0, y:0, h:9, label:"", wide:true},
            l:{until:0, x:0, y:0, h:9, label:"", wide:true} };
function clusters(list, pred, r){
  var out=[], used={};
  for (var i=0;i<list.length;i++){
    var a=list[i]; if (!pred(a)||used[a.id]) continue;
    var grp=[a];
    for (var j=0;j<list.length;j++){ var b=list[j]; if (b===a||!pred(b)||used[b.id]) continue;
      if (Math.abs(b.x-a.x)<=r && Math.abs(b.y-a.y)<=r){ grp.push(b); } }
    if (grp.length>=2){ grp.forEach(function(q){ used[q.id]=1; }); out.push(grp); }
  }
  return out;
}
function pickShot(key, list, u, S){
  var sh=shots[key], cands=[];
  function add(grp, label, w){ var cx=0, cy=0; grp.forEach(function(a){cx+=a.x;cy+=a.y;});
    cands.push({x:cx/grp.length, y:cy/grp.length, n:grp.length, label:label, w:w}); }
  clusters(list, function(a){return a.act===A_BIRTH;}, 3).forEach(function(g){ add(g, "a birth", 6); });
  list.forEach(function(a){ if (a.act===A_BIRTH) cands.push({x:a.x,y:a.y,n:1,label:"a birth",w:6}); });
  clusters(list, function(a){return a.act===A_FIGHT;}, 2).forEach(function(g){ add(g, key==="e"?"a brawl in the pen":"a fight", 4); });
  clusters(list, function(a){return a.act===A_MATE;}, 1).forEach(function(g){ add(g, "a couple", 2.5); });
  clusters(list, function(a){return a.act===A_TALK;}, 3).forEach(function(g){ if (g.length>=3) add(g, key==="e"?"a huddle by the boxes":"talk at the hearths", 3); });
  clusters(list, function(a){return a.act===A_PLAY;}, 4).forEach(function(g){ if (g.length>=3) add(g, "children at play", 3); });
  clusters(list, function(a){return a.act===A_HUNT;}, 4).forEach(function(g){ if (g.length>=2) add(g, "a hunting party in the woods", 3); });
  clusters(list, function(a){return a.act===A_FISH;}, 4).forEach(function(g){ if (g.length>=2) add(g, "fishing from the shore", 3); });
  clusters(list, function(a){return a.act===A_FORAGE;}, 4).forEach(function(g){ if (g.length>=3) add(g, "a foraging party", 2.5); });
  clusters(list, function(a){return a.act===A_FARM;}, 4).forEach(function(g){ if (g.length>=3) add(g, "work in the fields", 2.5); });
  clusters(list, function(a){return a.act===A_EAT;}, 4).forEach(function(g){ if (g.length>=6) add(g, "the crowd at the hopper", 2); });
  clusters(list, function(a){return a.act===A_WITHDRAW;}, 4).forEach(function(g){ if (g.length>=4) add(g, "the beautiful ones, apart", 2); });
  clusters(list, function(a){return a.act===A_REST;}, 3).forEach(function(g){ if (g.length>=3) add(g, "resting together", 1.5); });
  if (!sh.wide || !cands.length){                   // the wide shot of the whole world
    sh.wide=true; sh.label=""; sh.until=tick+ (cands.length? 300 : 900);
    return;
  }
  var tot=0; cands.forEach(function(c){ c.wt=c.w*Math.sqrt(c.n); tot+=c.wt; });
  var r=Math.random()*tot, pick=cands[cands.length-1];
  for (var i=0;i<cands.length;i++){ r-=cands[i].wt; if (r<=0){ pick=cands[i]; break; } }
  sh.wide=false; sh.x=pick.x; sh.y=pick.y; sh.h=Math.max(5, Math.min(9, 4+pick.n*0.6));
  sh.label=pick.label; sh.until=tick+ 520 + Math.random()*300;
}

    var S=terr9?terr9.length:160, x=0,y=0, tries=0;
    do { x=20+Math.random()*(S-30); y=20+Math.random()*(S-30); tries++; }
    while (tries<60 && !(terr9 && terr9[Math.round(y)][Math.round(x)]===1));
    wild9.push({x:x,y:y,tx:x,ty:y,pred:0,ph:Math.random()});
  }

    var w=wild9[i]; w.pred=i>=nGame;
    var d=Math.hypot(w.tx-w.x,w.ty-w.y);
    if (d<0.1 && Math.random()<0.01){ w.tx=w.x+(Math.random()-0.5)*8; w.ty=w.y+(Math.random()-0.5)*8;
      if (terr9){ var S2=terr9.length, cx=Math.round(Math.max(1,Math.min(S2-2,w.tx))), cy=Math.round(Math.max(1,Math.min(S2-2,w.ty)));

      g.beginPath(); g.moveTo(-7,-5); g.quadraticCurveTo(-11,-9,-12,-4); g.stroke();

function render(canvas, composed, map, key, u){

  var list=[], minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  Object.keys(map).forEach(function(id){
    var a=map[id]; list.push(a); a.nudge=0;
    if(a.x<minx)minx=a.x; if(a.x>maxx)maxx=a.x;
    if(a.y<miny)miny=a.y; if(a.y>maxy)maxy=a.y;
  });
  var sh=shots[key];
  if (tick>=sh.until) pickShot(key, list, u, S);
  var tx,ty,th;
  if (c.mode==="walk"){
    tx=c.tx; ty=c.ty; th=WALK_H;
  } else if (c.mode==="follow" && map[c.follow]){
    var who=map[c.follow];
    tx=who.x; ty=who.y; th=c.th;

  var hy=c.h, hx=Math.min(S/2, c.h*aspect);

    else if (u.season==="summer"){ g.fillStyle="rgba(255,214,140,0.07)"; g.fillRect(0,0,canvas.width,canvas.height); }
    else if (u.season==="autumn"){ g.fillStyle="rgba(214,140,60,0.10)"; g.fillRect(0,0,canvas.width,canvas.height); }

// ---- the overlay: captions and the person you are watching ---------------

function paintOverlay(key){
  var ov=document.getElementById(key==="e"?"o6":"o9");
  var v=view[key]; if(!ov||!v) return;
  var g=ov.getContext("2d");
  g.clearRect(0,0,ov.width,ov.height);
  var map=key==="e"?actors6:actors9;
  var u=state?state.u[key==="e"?"eden":"lagoon"]:null;
  var ts=v.ts, sx=v.sx, sy=v.sy;
  var dpr=ov.width/(ov.clientWidth||ov.width)||1;

  // Nest-box occupancy: territory, made visible. A held box is drawn in
  // amber; a vacant one in quiet green. This is the variable Calhoun was
  // actually studying, so it must be visible and not merely counted.
  //
  // Note what green does NOT mean: a vacant place is not an opportunity.
  // Roles in the pen are filled once. A place emptied by death is taken
  // again only by a newcomer — never by the people already displaced.
  // That is the whole of "death squared", and it is why the boxes can be
  // half empty while a fifth of the pen has no territory at all.
  if (key==="e" && u && u.boxes_xy && u.box_occ && ts>5){
    for (var bi=0;bi<u.boxes_xy.length;bi++){
      var bb=u.boxes_xy[bi];
      var n=u.box_occ[String(bi)]||0;
      var ac=alcoveFor(bb,u.size||48);

      if (x0<-60||y0<-60||x0>ov.width+60||y0>ov.height+60) continue;

      g.strokeStyle=(n>0)?"#f8d848":"#2f5a4c";
      g.strokeRect(Math.round(x0), Math.round(y0), Math.round(2*ts), Math.round(2*ts));
    }
  }

  var caption = s>=1.6;                   // only caption when few enough to read
  g.textAlign="center"; g.textBaseline="alphabetic";
  g.font=Math.round(11*dpr)+"px Menlo,Monaco,monospace";
  var placed=[];                          // captions already drawn, to avoid collisions
  var list=[]; Object.keys(map).forEach(function(id){ list.push(map[id]); });

    var a=list[i];

    if (px<-60||py<-60||px>ov.width+60||py>ov.height+60) continue;
    if (!caption || cam[key].mode==="walk") continue;
    var ak=a.moving?A_WALK:a.act;
    if (nSeen>12 && (seen[ak]||0)>nSeen*0.06 && a.id!==sel[key]) continue;
    var lbl=(a.moving?"walking":(ACT_LABEL[a.act]||"idle"));
    var wpx=g.measureText(lbl).width;
    var top=py-ts*1.55-13*dpr;

    }

                 .sort(function(a,b){ return Math.hypot(a.x-cam[key].x,a.y-cam[key].y)-Math.hypot(b.x-cam[key].x,b.y-cam[key].y); })
                 .slice(0,8);

}

// ---- taking the camera: zoom, pan, pick a person -------------------------
function worldAt(key,mx,my){
  var v=view[key]; if(!v) return null;
  var dpr=v.canvas.width/(v.canvas.clientWidth||v.canvas.width)||1;
  return {x: v.sx+(mx*dpr)/v.ts, y: v.sy+(my*dpr)/v.ts};
}
function zoomAt(key,mx,my,factor){
  var c=cam[key], v=view[key]; if(!v) return;
  var before=worldAt(key,mx,my); if(!before) return;
  var nh=Math.max(MIN_H, Math.min(MAX_H, c.h*factor));
  var aspect=v.canvas.width/v.canvas.height;
  var hy=nh, hx=Math.min(v.S/2, nh*aspect);
  if (hx/aspect<hy) hy=hx/aspect;
  var fx=(before.x-(c.x-v.hx))/(2*v.hx);
  var fy=(before.y-(c.y-v.hy))/(2*v.hy);
  c.x=before.x-(2*fx-1)*hx;
  c.y=before.y-(2*fy-1)*hy;
  c.h=nh; c.th=nh; c.tx=c.x; c.ty=c.y; c.mode="manual"; c.follow=0;
  sel[key]=0; refreshHud(key); paintCard(key);
}
function pickPerson(key,mx,my){
  var v=view[key]; if(!v) return 0;
  var w=worldAt(key,mx,my); if(!w) return 0;
  var map=key==="e"?actors6:actors9;
  var best=0, bestD=1e9;
  Object.keys(map).forEach(function(id){
    var a=map[id];
    // a figure stands on its feet and reaches about 1.5 tiles up
    var top=a.y-1.5, bot=a.y;
    var dy=0;
    if (w.y>bot) dy=w.y-bot;
    else if (w.y<top) dy=top-w.y;
    var d=Math.hypot(Math.abs(a.x-w.x), dy);
    if(d<bestD){ bestD=d; best=a.id; }
  });
  return bestD<1.0 ? best : 0;
}
function bindWorld(canvasId, key){

    var r=cv.getBoundingClientRect();
    drag={x:e.clientX,y:e.clientY,mx:e.clientX-r.left,my:e.clientY-r.top,moved:false};
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  });
  cv.addEventListener("pointermove", function(e){
    if(!drag) return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    var v=view[key]; if(!v) return;
    var dpr=v.canvas.width/(v.canvas.clientWidth||v.canvas.width)||1;
    var c=cam[key];
    c.x-=dx*dpr/v.ts; c.y-=dy*dpr/v.ts;
    c.x=Math.max(v.hx, Math.min(v.S-v.hx, c.x));
    c.y=Math.max(v.hy, Math.min(v.S-v.hy, c.y));
    c.tx=c.x; c.ty=c.y; c.mode="manual"; c.follow=0;
    drag.x=e.clientX; drag.y=e.clientY;
  });
  cv.addEventListener("pointerup", function(e){
    if (drag && !drag.moved){
      var id=pickPerson(key, drag.mx, drag.my);
      sel[key]=id;
      if (id){ cam[key].mode="follow"; cam[key].follow=id; }
      else { cam[key].mode="auto"; cam[key].follow=0; }
      refreshHud(key); paintCard(key);
    }
    drag=null;
  });
  cv.addEventListener("pointercancel", function(){ drag=null; });
}
// ---- walking in ------------------------------------------------------------
// The Observers never intervene, but the viewer may walk the ground at a
// person's height: the camera becomes a pair of eyes that moves with the
// keys, and whoever is near is introduced by name.
var WALK_H=2.6, WALK_R=3.6, WALK_SPEED=0.14, activeWorld="e", held={};
var WALK_KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
               w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
function enterWalk(key){
  var c=cam[key]; if (c.mode==="walk") return;
  c.mode="walk"; c.follow=0; sel[key]=0; c.tx=c.x; c.ty=c.y;
  document.getElementById("walkbtn").className="on";
  refreshHud(key); paintCard(key);
}
function leaveWalk(){
  ["e","l"].forEach(function(k){ cam[k].mode="auto"; cam[k].follow=0; sel[k]=0; });
  document.getElementById("walkbtn").className="";
  refreshHud("e"); refreshHud("l"); paintCard("e"); paintCard("l");
}
function stepWalk(){
  ["e","l"].forEach(function(k){
    var c=cam[k], v=view[k]; if (c.mode!=="walk"||!v) return;
    var dx=0, dy=0;
    Object.keys(held).forEach(function(n){ var d=WALK_KEYS[n]; if (d){ dx+=d[0]; dy+=d[1]; } });
    if (!dx&&!dy) return;
    var n=Math.hypot(dx,dy);
    c.tx=Math.max(1,Math.min(v.S-1,c.tx+dx/n*WALK_SPEED));
    c.ty=Math.max(1,Math.min(v.S-1,c.ty+dy/n*WALK_SPEED));
  });
}
["w6","w9"].forEach(function(id){
  var el=document.getElementById(id), k=id==="w6"?"e":"l";
  el.addEventListener("pointerenter", function(){ activeWorld=k; });
  el.addEventListener("pointerdown", function(){ activeWorld=k; });
});
document.getElementById("walkbtn").addEventListener("click", function(){
  if (cam[activeWorld].mode==="walk") leaveWalk(); else enterWalk(activeWorld);
});
document.addEventListener("keydown", function(e){
  if (e.key==="Escape"||e.key===" "){
    leaveWalk(); held={};
    if (e.key===" ") e.preventDefault();
    return;
  }
  if (e.key==="i"||e.key==="I"){
    if (cam[activeWorld].mode==="walk") leaveWalk(); else enterWalk(activeWorld);
    return;
  }
  if (WALK_KEYS[e.key]){
    enterWalk(activeWorld); held[e.key]=1;
    if (e.key.indexOf("Arrow")===0) e.preventDefault();
  }
});
document.addEventListener("keyup", function(e){ delete held[e.key]; });
window.addEventListener("blur", function(){ held={}; });

// =========================================================== god panel
function sparkline(id, census, color){
  var cv=document.getElementById(id);
  if (!cv || !census || census.length<2) return;
  var g=cv.getContext("2d"), W=cv.width=cv.clientWidth||120, H=cv.height=cv.clientHeight||22;
  g.clearRect(0,0,W,H);
  var max=1; census.forEach(function(r){ if(r[1]>max)max=r[1]; });
  var n=census.length, bw=Math.max(1,Math.floor(W/n));
  g.fillStyle=color;
  for (var i=0;i<n;i++){
    var h=Math.max(1,Math.round(census[i][1]/max*(H-4)));
    g.fillRect(i*bw, H-h, Math.max(1,bw-1), h);
  }
}
function doingHTML(people){
  if (!people||!people.length) return "";
  var tally={};
  for (var i=0;i<people.length;i++){ var act=people[i].length>5?people[i][5]:0; tally[act]=(tally[act]||0)+1; }
  var rows=Object.keys(tally).map(function(k){ return [ACT_LABEL[k]||"?", tally[k]]; });
  rows.sort(function(a,b){ return b[1]-a[1]; });
  return "<span class='now'>NOW "+rows.slice(0,4).map(function(r){ return r[1]+" "+r[0]; }).join(" · ")+"</span>";
}
// The world's own facts, one dim line under its title: what a viewer needs to
// read the picture, nothing a viewer would have to decode.
function statLine(u, kind){
  var b=kind==="e"?[]:["PEAK "+u.peak];             // EDEN's arc is in the corner graph
  if (u.iter>1) b.push("ITERATION "+u.iter);
  if (kind==="e"){
    if (u.roles) b.push("POSTS "+u.roles[0]+"/"+u.roles[1]);
    if (u.sink>45) b.push("SINK "+u.sink+"% AT ONE BAR");
    if (u.homeless>0) b.push(u.homeless+" PLACELESS");
    if (u.std) b.push("OUTBREAK");
    if (u.ennui>0.2) b.push("ENNUI "+Math.round(u.ennui*100)+"%");
  } else {
    b.push("TRIBES "+((u.settlements||[]).length), "STORE "+Math.round(u.store||0));
    b.push(u.season==="winter"&&u.harsh?"ICE-AGE WINTER":(u.season||"").toUpperCase());
    if (u.dry) b.push("DROUGHT");
    if (u.myths&&u.myths.length) b.push(u.myths.length+" MYTHS");
    if (u.lessons&&u.lessons.length) b.push("INSTINCTS "+u.lessons.join(", ").toUpperCase());
    if (u.culture&&u.culture.length) b.push(u.culture.length+" ARTS");
  }
  var cod=u.cod||{}, ck=Object.keys(cod);
  if (ck.length){
    ck.sort(function(a,c){return cod[c]-cod[a];});
    b.push("DEATHS "+ck.slice(0,2).map(function(k){return k+" "+cod[k];}).join(", "));
  }
  return "<span class='dim'>"+b.join(" · ")+"</span>";
}
var hudExtra="", edenSize=0;
// ---- the diary: what the person you follow has done since you started
// watching — the Truman view. Kept by the viewer, one line per change.
var diary={e:[], l:[]}, diaryWho={e:0, l:0}, diaryLast={e:"", l:""};
function keepDiary(key, u){
  var id=sel[key];
  if (id!==diaryWho[key]){ diary[key]=[]; diaryWho[key]=id; diaryLast[key]=""; }
  if (!id) return;
  var map=key==="e"?actors6:actors9, a=map[id], d=u.detail&&u.detail[String(id)];
  if (!a || !d){
    if (diaryLast[key]!=="gone"){
      var ev=(state.events||[]).slice().reverse().find(function(e){ return e.msg.indexOf(diary[key].name||"\u0000")>=0; });
      diary[key].push("Y"+u.year+" · "+(ev?ev.msg:"is gone from the record — dead, with no line of their own."));
      diaryLast[key]="gone";
    }
    return;
  }
  diary[key].name=d[0];
  var what=ACT_LABEL[a.act]||"idle";
  if (what!==diaryLast[key]){
    diaryLast[key]=what;
    var at=(u.day%360);
    diary[key].push("Y"+u.year+" d"+at+" · "+what);
    if (diary[key].length>6) diary[key].shift();
  }
}
function whoInfo(key){
  var id=sel[key]; if(!id) return null;
  var map=key==="e"?actors6:actors9;
  var a=map[id]; if(!a) return null;
  var u=state && state.u[key==="e"?"eden":"lagoon"];
  var d=(u && u.detail) ? u.detail[String(id)] : null;
  if (!d) return null;
  return {id:id, name:d[0], age:d[1], gen:d[2], flags:d[3],
          hx:d[4], hy:d[5], pid:d[6], hun:d[7], u:u,
          act:a.moving?"walking":(ACT_LABEL[a.act]||"idle")};
}
function hudText(u, kind){
  var l2 = kind==="e" ? u.phase.toUpperCase()+" · ALWAYS SPRING"
    : (u.tech&&u.tech.length?"AGE OF "+u.tech[u.tech.length-1].replace("_"," ").toUpperCase():u.phase.toUpperCase());
  var sh=shots[kind], cap = (sh && !sh.wide && sh.label) ? "<span class='shot'> · "+sh.label.toUpperCase()+"</span>" : "";
  var v=view[kind];
  var sc = "";
  var w=whoInfo(kind);
  var who = w ? "<span class='who'> · "+w.name.toUpperCase()+", "+w.act.toUpperCase()+"</span>" : "";
  var key = (kind==="e" && v && v.ts>5) ? "  <span class='key' style='border-color:#f8d848'></span>held "+
            "<span class='key' style='border-color:#2f5a4c'></span>vacant" : "";
  return "<div class='l1'><b>UNIVERSE "+(kind==="e"?"6 · EDEN":"9 · LAGOON")+"</b>  Y"+u.year+
         " · POP "+u.pop+" · "+l2+(kind==="e"?hudExtra:"")+sc+cap+who+"</div>"+
         doingHTML(u.people)+key+"\n"+statLine(u, kind);
}
function refreshHud(kind){
  if (!state) return;
  var h=hudText(state.u[kind==="e"?"eden":"lagoon"], kind);
  if (hudCache[kind]!==h){
    hudCache[kind]=h;
    document.getElementById(kind==="e"?"hud6":"hud9").innerHTML=h;
  }
}
// the lower third: who you are watching
function paintCard(key){
  var el=document.getElementById(key==="e"?"card6":"card9");
  var w=whoInfo(key);
  if(!w && sel[key] && diary[key].length && diaryLast[key]==="gone"){
    el.className="card on";
    el.innerHTML="<span class='nm'>"+(diary[key].name||"")+"</span><br><span class='dl'>"+diary[key].slice(-3).join("<br>")+"</span>";
    return;
  }
  if(!w){ el.className="card"; el.innerHTML=""; return; }
  el.className="card on";
  var bits=[];
  var wa=(key==="e"?actors6:actors9)[w.id];
  if (w.flags&1)  bits.push(["withdrawn","withdrawn — huddled on the floor with the others who gave up",
                             "withdrawn — one of the beautiful ones: eats, sleeps, grooms, alone",
                             "withdrawn — alone in an upper cabana"][(wa&&wa.wk)||0]);
  if (w.flags&2)  bits.push("incompetent — born into the sink");
  if (w.flags&4)  bits.push("pregnant");
  if (w.flags&8)  bits.push("minding an infant");
  if (w.flags&16) bits.push("no territory — every nest box is full");
  if (w.flags&32) bits.push("hungry");
  if (w.flags&64) bits.push("elder");
  var pname="no partner";
  if (w.pid && w.u.detail){
    var pd=w.u.detail[String(w.pid)];
    if (pd) pname="partner: "+pd[0];
  }
  var d=w.u.detail[String(w.id)]||[];
  if (d[8]) bits.unshift(d[8]);
  if (d.length>11) bits.push("purpose "+Math.round(d[9]*100)+"% · self-control "+Math.round(d[10]*100)+"% · temper "+Math.round(d[11]*100)+"%");
  el.innerHTML="<span class='nm'>"+w.name+"</span> · "+w.act+
    "<br><span class='dl'>"+w.age+" years · generation "+w.gen+
    " · "+w.hun+" hunger<br>"+
    (key==="e" ? "nest box at "+w.hx+","+w.hy : "hearth at "+w.hx+","+w.hy)+
    " · "+pname+
    (bits.length?"<br>"+bits.join(" · "):"")+"</span>"+
    (diary[key].length>1?"<br><span class='dl'>"+diary[key].slice(-4).join(" → ")+"</span>":"");
}

// ---------------------------------------------------------- the console
// The record of what happened, kept as a record: filterable, scrollable, and
// never overwritten by the next thing that happens.
var KIND_GROUP={
  generation:"life", childbirth:"life", famine:"life", predator:"life",
  violence:"life", disease:"life",
  discovery:"world", disaster:"world", phase:"world", migration:"world",
  feud:"world", culture:"world", ennui:"world",
  extinction:"end", reseed:"end", lesson:"end", epidemic:"end"
};
// kinds that arrive one person at a time and read better as one line
// [the line's verb, the pattern that finds who it happened to]
var REPEATS={famine:["starved",/^(\S+) starves/], predator:["taken by predators",/^(\S+) is taken/],
             violence:["killed in brawls",/^(\S+) is killed in a sudden brawl/],
             childbirth:["died in childbirth",/^(\S+) dies bringing/]};
function victimOf(e){ var r=REPEATS[e.t]; var m=r&&e.msg.match(r[1]); return m?m[1]:null; }
var conFilter={u:"all",k:"all"};
var conEvents=[];
function eventClass(e){
  if (conFilter.u!=="all" && e.u!==conFilter.u) return null;
  var g=KIND_GROUP[e.t]||"world";
  if (conFilter.k!=="all" && g!==conFilter.k) return null;
  return g;
}
function updateRecords(events){
  if (events && events.length) conEvents=events;
  var el=document.getElementById("reclines");
  var rows=[];
  for (var i=0;i<conEvents.length;i++){
    var g=eventClass(conEvents[i]);
    if (g) rows.push({e:conEvents[i], g:g});
  }
  if (!rows.length){
    el.innerHTML="<div class='empty'>Nothing recorded under this filter.</div>";
    return;
  }
  var runs=[];
  for (var k=0;k<rows.length;k++){
    var last=runs[runs.length-1], e=rows[k].e;
    if (last && last.e.y===e.y && last.e.u===e.u && last.e.t===e.t && victimOf(e) && victimOf(last.e)) last.more.push(e);
    else runs.push({e:e, g:rows[k].g, more:[]});
  }
  var html=runs.slice(-300).map(function(r){
    var e=r.e, msg=e.msg;
    if (r.more.length){
      var names=[e].concat(r.more).map(victimOf);
      msg="<span class='n'>"+names.length+"</span> "+REPEATS[e.t][0]+": "+names.join(", ");
    }
    return "<div class='row "+r.g+"'><span class='yr'>Y"+e.y+"</span> "+
      "<span class='"+(e.u==="EDEN"?"u6":"u9")+"'>"+(e.u==="EDEN"?"U6":"U9")+"</span> "+
      "<span class='yr'>["+e.t+"]</span> "+msg+"</div>";
  }).join("");
  if (el.innerHTML!==html){
    el.innerHTML=html;
    el.scrollTop=el.scrollHeight;
  }
}
document.getElementById("more").addEventListener("click", function(){
  var god=document.getElementById("god");
  god.className = god.className==="tall" ? "" : "tall";
  this.className = god.className==="tall" ? "on" : "";
  this.textContent = god.className==="tall" ? "LESS" : "MORE";
  fit(); updateRecords(null);
});
document.getElementById("filters").addEventListener("click", function(e){
  var b=e.target; if(!b||b.tagName!=="BUTTON") return;
  if (b.dataset.u!==undefined){
    conFilter.u=b.dataset.u;
    Array.prototype.forEach.call(this.querySelectorAll("button[data-u]"), function(x){
      x.className=(x.dataset.u===conFilter.u)?"on":"";
    });
  } else {
    conFilter.k=b.dataset.k;
    Array.prototype.forEach.call(this.querySelectorAll("button[data-k]"), function(x){
      x.className=(x.dataset.k===conFilter.k)?"on":"";
    });
  }
  updateRecords(null);
});

// =========================================================== loops
function reportError(where, ev){
  var msg=(ev && ev.message) ? ev.message : String(ev);
  try{ console.error("UNIVERSE69 "+where+": "+msg); }catch(e){}
  var el=document.getElementById("reclines");
  if (el) el.innerHTML="<div class='row end'>VIEWER ERROR in "+where+": "+msg+"</div>";
}
window.addEventListener("error", function(ev){
  reportError("page", (ev && ev.message) ? ev : {message:String(ev)});
});
function fit(){
  var dpr=Math.min(window.devicePixelRatio||1, 2.5);
  ["c6","c9"].forEach(function(id){
    var cv=document.getElementById(id);
    cv.width=Math.round(cv.clientWidth*dpr); cv.height=Math.round(cv.clientHeight*dpr);
    var ov=document.getElementById(id==="c6"?"o6":"o9");
    ov.width=cv.width; ov.height=cv.height;
  });
  spriteCache={}; spriteCount=0;
}
window.addEventListener("resize", fit);
function loadWorld(){
  if (SNAP) return Promise.resolve();
  return fetchJSON("/world").then(function(w){ worldInfo=w; lagoonIter=w.lagoon_iter; });
}
function poll(){
  (SNAP?fetchJSON(SNAP):fetchJSON("/state")).then(function(st){
    state=st; pollSeq++;
    if (!SNAP&&worldInfo&&st.u.lagoon.iter!==lagoonIter) loadWorld().then(function(){ base9=null; });
    var es=st.u.eden.size||48;
    if (edenSize && es!==edenSize){                 // the resort grew: the engine moved
      var k=(es-edenSize)/2;                         // everyone by k; so do we, at once
      Object.keys(actors6).forEach(function(id){ var a=actors6[id]; a.x+=k; a.y+=k; a.tx+=k; a.ty+=k; a.ltx=a.tx; a.lty=a.ty; });
      cam.e.x+=k; cam.e.y+=k; cam.e.tx+=k; cam.e.ty+=k;
    }
    edenSize=es;
    syncActors(actors6, st.u.eden.people, EM, st.u.eden.detail);
    keepDiary("e", st.u.eden); keepDiary("l", st.u.lagoon);
    syncActors(actors9, st.u.lagoon.people, 0, st.u.lagoon.detail);
    if (heat9 && pollSeq%40===0){ for (var i=0;i<heat9.length;i++) heat9[i]=(heat9[i]*0.92)|0; }
    var e=st.u.eden,l=st.u.lagoon, extra="";
    if (st.status&&st.status.catching_up) extra="  ·  FAST-FORWARDING "+st.status.behind_days+" DAYS";
    else if (SNAP){ var age=Math.max(0,Math.round(Date.now()/1000-st.wall)); extra="  ·  OBSERVED "+(age<90?age+"S":Math.round(age/60)+" MIN")+" AGO"; }
    hudExtra=extra; refreshHud("e"); refreshHud("l");
    sparkline("tre", e.census, "#a8c0f0"); sparkline("trl", l.census, "#a0e898");
  }).catch(function(){});
}
// 30 frames a second, backing off to 15 if the machine is struggling
var frameMs=33, loopTimer=null, costAvg=10;
function frame(){
  if (document.hidden) return;
  var t0=performance.now();
  tick++;
  try{
  if (state){
    stepWalk();
    render(document.getElementById("c6"), compose6(state.u.eden), actors6, "e", state.u.eden);
    render(document.getElementById("c9"), compose9(state.u.lagoon, state), actors9, "l", state.u.lagoon);
    paintOverlay("e"); paintOverlay("l");
    if (tick%4===0){ refreshHud("e"); refreshHud("l"); }
    if (tick%8===0){ updateRecords(state.events); paintCard("e"); paintCard("l"); }
  }
  }catch(err){ reportError("frame", err); }
  costAvg=costAvg*0.9+(performance.now()-t0)*0.1;
  var want = costAvg>26 ? 66 : (costAvg<14 ? 33 : frameMs);
  if (want!==frameMs){ frameMs=want; clearInterval(loopTimer); loopTimer=setInterval(frame, frameMs); }
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden){ fit(); frame(); } });
fit();
bindWorld("c6","e");
bindWorld("c9","l");
loadWorld().then(function(){
  poll(); setInterval(poll,2000);
  frame(); loopTimer=setInterval(frame, frameMs);
});
</script>
