<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>UNIVERSE 69</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:#000; color:#d8d8e8; font-family:Menlo,Monaco,monospace;
         display:flex; flex-direction:column; }
  #worlds { flex:2; display:flex; min-height:0; }
  .world { flex:1; position:relative; min-width:0; }
  #divider { width:2px; background:#3a3a55; }
  canvas.view { width:100%; height:100%; display:block; image-rendering:pixelated; }
  .hud { position:absolute; top:0; left:0; right:0; padding:6px 10px;
         font-size:11px; line-height:1.5; white-space:pre-wrap;
         background:rgba(0,0,10,0.55); pointer-events:none; }
  .hud b { color:#f8d848; font-weight:bold; }
  #god { flex:1; border-top:2px solid #3a3a55; display:flex; min-height:0;
         background:#07070e; }
  .stat { width:25%; padding:8px 12px; font-size:11px; line-height:1.7;
          overflow:hidden; white-space:pre-wrap; }
  .stat h2 { font-size:11px; margin-bottom:2px; letter-spacing:1px; }
  #s6 h2 { color:#a8c0f0; } #s9 h2 { color:#a0e898; }
  .trend { width:100%; height:44px; image-rendering:pixelated; display:block;
           margin:4px 0; }
  #records { flex:1; padding:8px 14px; font-size:11px; line-height:1.85;
             overflow:hidden; border-left:2px solid #3a3a55;
             border-right:2px solid #3a3a55; }
  #records h2 { font-size:11px; color:#f8d848; letter-spacing:2px; margin-bottom:2px; }
  #records .cur::after { content:"▼"; color:#f8d848; margin-left:6px;
                         animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .ev6 { color:#a8c0f0; } .ev9 { color:#a0e898; } .evy { color:#666a88; }
  .dim { color:#8888aa; }
  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    #worlds { flex-direction:column; }
    #divider { width:auto; height:2px; }
    #god { flex-direction:row; flex-wrap:wrap; overflow-y:auto; }
    #records { flex:1 1 100%; order:0; border-left:none; border-right:none;
               border-bottom:2px solid #3a3a55; min-height:120px; }
    .stat { width:50%; order:1; font-size:10px; line-height:1.6; }
    .hud { font-size:10px; padding:4px 8px; }
  }
</style>
</head>
<body>
<div id="worlds">
  <div class="world"><canvas id="c6" class="view"></canvas>
    <div class="hud" id="hud6"><b>UNIVERSE 6 · EDEN</b></div></div>
  <div id="divider"></div>
  <div class="world"><canvas id="c9" class="view"></canvas>
    <div class="hud" id="hud9"><b>UNIVERSE 9 · LAGOON</b></div></div>
</div>
<div id="god">
  <div class="stat" id="s6"></div>
  <div id="records"><h2>THE OBSERVER'S RECORD</h2><div id="reclines"></div></div>
  <div class="stat" id="s9"></div>
</div>

<script src="config.js"></script>
<script>
var SNAP = window.SNAPSHOT_URL || null;
var PX = 12;          // offscreen pixels per world tile
var EM = 12;          // EDEN resort margin (tiles) around the pen

// ---- palette: muted, 3 tones per material, light from the north-west ----
var P = {
  waterD:"#1f4e8c", water:"#2a62a8", waterL:"#4a86c8", foam:"#cfe8f8",
  sand:"#d4bc7a", sandL:"#e2cf96", sandD:"#b89c58", sandWet:"#b9a060",
  grass:"#4e8a3a", grassD:"#3f7230", grassL:"#6aa84e",
  floorF:"#2f5e28", canD:"#1e461e", can:"#2f6b2c", canL:"#4a8a3c",
  trunk:"#6b4226", trunkD:"#4e2f18",
  soil:"#8a6530", soilD:"#6e4e1c", soilL:"#a07a3e",
  thatch:"#9a7a3a", thatchD:"#7c6028", thatchL:"#b8955a",
  hutwall:"#7a5a34", hutdoor:"#2c1a0c",
  stone:"#b4ac9c", stoneB:"#bcb4a4", mortar:"#978f80", dust:"#a8a092",
  wallTop:"#8a7f6c", wall:"#6a5f4e", wallFace:"#473d30", alcove:"#2e2619",
  hopper:"#e0b838", hopperD:"#b08a18", trough:"#4a90d9",
  lawn:"#55a04c", lawnD:"#4c9344", palm:"#2f7a38", palmL:"#3f9a48",
  pool:"#38b8e0", poolL:"#7cd8f0", rim:"#e8e8e0", deck:"#d8c9a0",
  skin:"#eac898", shadow:"rgba(0,0,0,0.30)"
};
// tunic colours + shade + hair, by class: child, man, woman, elder, withdrawn
var TUN = ["#e8c94e", "#3f6fd8", "#d45a8c", "#9a9a9a", "#9ae8e0"];
var TUS = ["#c0a132", "#2e52a8", "#aa4068", "#787878", "#74c2ba"];
var HAIR= ["#6b4a26", "#2a1c10", "#3a2414", "#d8d8d8", "#bfeae6"];

function hash2(x,y){ var h=(x*374761393+y*668265263)>>>0;
  h=(h^(h>>13))*1274126177>>>0; return (h^(h>>16))/4294967295; }
function lerp(a,b,t){ return a+(b-a)*t; }
function fetchJSON(u){ return fetch(u,{cache:"no-store"}).then(function(r){ return r.json(); }); }
function mkCanvas(wpx){ var c=document.createElement("canvas"); c.width=c.height=wpx; return c; }

var worldInfo=null, lagoonIter=-1, state=null, tick=0, pollSeq=0;
var cam={ e:{x:24+EM,y:24+EM,h:9}, l:{x:137,y:109,h:9} };

// =========================================================== LAGOON layers
var base9=null, semi9=null, frame9=null, semi9seq=-1, water9=[], terr9=null;

function nIs(terrain,x,y,k){ var S=terrain.length;
  return x>=0&&y>=0&&x<S&&y<S&&terrain[y][x]===k; }

function buildBase9(terrain){
  var S=terrain.length;
  base9=mkCanvas(S*PX); semi9=mkCanvas(S*PX); frame9=mkCanvas(S*PX);
  water9=[]; terr9=terrain;
  var g=base9.getContext("2d");
  for (var y=0;y<S;y++) for (var x=0;x<S;x++){
    var k=terrain[y][x], X=x*PX, Y=y*PX, h=hash2(x,y);
    if (k===2){ // water: depth mottling + foam against every shore
      g.fillStyle=P.water; g.fillRect(X,Y,PX,PX);
      if (h>0.72){ g.fillStyle=P.waterD; g.fillRect(X+2,Y+5,8,4); }
      if (nIs(terrain,x,y-1,0)||nIs(terrain,x,y-1,1)||nIs(terrain,x,y-1,3)){
        g.fillStyle=P.foam; g.fillRect(X,Y,PX,2);
        g.fillStyle=P.waterL; g.fillRect(X,Y+2,PX,1); }
      if (nIs(terrain,x,y+1,0)||nIs(terrain,x,y+1,1)||nIs(terrain,x,y+1,3)){
        g.fillStyle=P.foam; g.fillRect(X,Y+PX-2,PX,2); }
      if (nIs(terrain,x-1,y,0)||nIs(terrain,x-1,y,1)||nIs(terrain,x-1,y,3)){
        g.fillStyle=P.foam; g.fillRect(X,Y,2,PX); }
      if (nIs(terrain,x+1,y,0)||nIs(terrain,x+1,y,1)||nIs(terrain,x+1,y,3)){
        g.fillStyle=P.foam; g.fillRect(X+PX-2,Y,2,PX); }
      if (h>0.55) water9.push([x,y]);
    } else if (k===3){ // sand: grain + wet band along the waterline
      g.fillStyle=P.sand; g.fillRect(X,Y,PX,PX);
      g.fillStyle=P.sandL; g.fillRect(X+(h*9|0),Y+(h*5|0),2,1);
      g.fillStyle=P.sandD;
      g.fillRect(X+(h*6|0)+2,Y+(h*8|0),1,1); g.fillRect(X+(h*11|0),Y+(h*3|0)+6,2,1);
      g.fillStyle=P.sandWet;
      if (nIs(terrain,x,y-1,2)) g.fillRect(X,Y,PX,3);
      if (nIs(terrain,x,y+1,2)) g.fillRect(X,Y+PX-3,PX,3);
      if (nIs(terrain,x-1,y,2)) g.fillRect(X,Y,3,PX);
      if (nIs(terrain,x+1,y,2)) g.fillRect(X+PX-3,Y,3,PX);
    } else if (k===1){ // forest floor
      g.fillStyle=P.floorF; g.fillRect(X,Y,PX,PX);
      if (h>0.6){ g.fillStyle=P.grassD; g.fillRect(X+(h*7|0),Y+(h*9|0),3,2); }
    } else { // grass: mottled patches + tufts
      g.fillStyle=P.grass; g.fillRect(X,Y,PX,PX);
      if (h>0.62){ g.fillStyle=P.grassD; g.fillRect(X+(h*6|0),Y+(h*8|0),5,3); }
      if (h>0.84){ g.fillStyle=P.grassL;
        g.fillRect(X+(h*9|0),Y+(h*5|0),1,2); g.fillRect(X+(h*9|0)+2,Y+(h*5|0)+1,1,2); }
      if (hash2(x+9,y+4)>0.96){ g.fillStyle="#e8e060"; g.fillRect(X+5,Y+4,2,2); }
    }
  }
  // trees: layered canopies on a sparse lattice, drawn after ground
  for (var y=1;y<S-1;y++) for (var x=1;x<S-1;x++){
    if (terrain[y][x]===1 && hash2(x*3,y*5)>0.80){
      var X=x*PX, Y=y*PX;
      g.fillStyle=P.shadow; g.fillRect(X-2,Y+8,PX+6,3);
      g.fillStyle=P.trunkD; g.fillRect(X+5,Y+4,4,7);
      g.fillStyle=P.trunk;  g.fillRect(X+5,Y+4,2,7);
      g.fillStyle=P.canD;   g.fillRect(X-4,Y-6,PX+8,10);
      g.fillStyle=P.can;    g.fillRect(X-2,Y-8,PX+4,9);
      g.fillStyle=P.canL;   g.fillRect(X,Y-9,8,4);
    }
  }
}

function paintFarm9(g,x,y){
  var X=x*PX, Y=y*PX;
  g.fillStyle=P.soil; g.fillRect(X,Y,PX,PX);
  g.fillStyle=P.soilD;
  g.fillRect(X,Y+2,PX,2); g.fillRect(X,Y+6,PX,2); g.fillRect(X,Y+10,PX,2);
  g.fillStyle=P.soilL; g.fillRect(X,Y,PX,1);
  if (hash2(x,y)>0.5){ g.fillStyle=P.grassL; g.fillRect(X+3,Y+4,1,2); g.fillRect(X+8,Y+8,1,2); }
}
function paintHut9(g,x,y){
  var X=x*PX, Y=y*PX;   // 2x2-tile hut with thatched roof
  g.fillStyle=P.shadow; g.fillRect(X+2,Y+PX*2-3,PX*2-2,3);
  g.fillStyle=P.hutwall; g.fillRect(X+2,Y+PX+2,PX*2-4,PX-4);
  g.fillStyle=P.hutdoor; g.fillRect(X+PX-3,Y+PX+4,6,PX-6);
  g.fillStyle=P.thatch;  g.fillRect(X,Y+3,PX*2,PX);
  g.fillStyle=P.thatchD;
  g.fillRect(X,Y+6,PX*2,1); g.fillRect(X,Y+10,PX*2,1); g.fillRect(X,Y+PX+1,PX*2,2);
  g.fillStyle=P.thatchL; g.fillRect(X+2,Y+2,PX*2-4,2);
}
var boats9=[], snow9=null, snowKey="";
function buildSemi9(u){
  var g=semi9.getContext("2d");
  g.drawImage(base9,0,0);
  var S=terr9.length;
  (u.farms||[]).forEach(function(f){
    if (f[0]>0&&f[0]<S-1&&f[1]>0&&f[1]<S-1) paintFarm9(g,f[0],f[1]); });
  var walled = (u.tech||[]).indexOf("metallurgy")>=0;
  (u.settlements||[]).forEach(function(s){
    if (walled && s.r>=10){                      // city walls, with a gate
      var r=s.r+1, X=(s.x-r)*PX, Y=(s.y-r)*PX, W=2*r*PX;
      g.fillStyle=P.wall;
      g.fillRect(X,Y,W,6); g.fillRect(X,Y+W-6,W,6);
      g.fillRect(X,Y,6,W); g.fillRect(X+W-6,Y,6,W);
      g.fillStyle=P.wallTop;
      g.fillRect(X,Y,W,2); g.fillRect(X,Y,2,W);
      g.fillStyle=P.hutdoor; g.fillRect(X+W/2-8,Y+W-6,16,6);  // south gate
    }
    paintHut9(g,s.x-1,s.y-1);
  });
  // boats moored off every settlement once seacraft exists
  boats9=[];
  if ((u.tech||[]).indexOf("seacraft")>=0){
    (u.settlements||[]).forEach(function(s){
      for (var d=2; d<9; d++){
        var cand=[[s.x-d,s.y],[s.x+d,s.y],[s.x,s.y-d],[s.x,s.y+d]];
        for (var i=0;i<cand.length;i++){
          var cx=cand[i][0], cy=cand[i][1];
          if (cx>1&&cy>1&&cx<S-1&&cy<S-1&&terr9[cy][cx]===2){
            boats9.push([cx,cy]); return;
          }
        }
      }
    });
  }
}
function buildSnow9(harsh){
  var S=terr9.length;
  snow9=mkCanvas(S*PX);
  var g=snow9.getContext("2d");
  var cover=harsh?0.15:0.42;
  for (var y=0;y<S;y++) for (var x=0;x<S;x++){
    if (terr9[y][x]!==2 && hash2(x*7,y*11)>cover){
      g.fillStyle="rgba(236,242,250,0.88)";
      g.fillRect(x*PX+1,y*PX+1,PX-2,PX-3);
      g.fillStyle="rgba(200,214,232,0.7)";
      g.fillRect(x*PX+2,y*PX+PX-3,PX-4,1);
    }
  }
}

// =========================================================== EDEN layers
var base6=null, frame6=null;
function buildBase6(){
  var S=48, W=S+2*EM;
  base6=mkCanvas(W*PX); frame6=mkCanvas(W*PX);
  var g=base6.getContext("2d");
  // resort lawn with mow stripes
  for (var y=0;y<W;y++) for (var x=0;x<W;x++){
    g.fillStyle=((x>>1)%2)?P.lawn:P.lawnD; g.fillRect(x*PX,y*PX,PX,PX);
    if (hash2(x,y)>0.9){ g.fillStyle=P.grassL; g.fillRect(x*PX+4,y*PX+6,2,1); }
  }
  // palms around the margin
  for (var py=2;py<W-2;py+=4) for (var px=2;px<W-2;px+=4){
    if ((px<EM-2||px>W-EM||py<EM-2||py>W-EM) && hash2(px,py)>0.62){
      var X=px*PX, Y=py*PX;
      g.fillStyle=P.shadow; g.fillRect(X-2,Y+6,16,3);
      g.fillStyle=P.trunk; g.fillRect(X+2,Y-2,3,9);
      g.fillStyle=P.palm;
      g.fillRect(X-6,Y-4,9,2); g.fillRect(X+4,Y-4,9,2);
      g.fillRect(X+2,Y-8,3,5); g.fillRect(X-3,Y-7,5,2); g.fillRect(X+5,Y-7,5,2);
      g.fillStyle=P.palmL; g.fillRect(X,Y-5,7,1);
    }
  }
  // the pool nobody in the pen will ever swim in
  g.fillStyle=P.deck; g.fillRect(2*PX,2*PX,9*PX,7*PX);
  g.fillStyle=P.rim;  g.fillRect(3*PX-2,3*PX-2,7*PX+4,5*PX+4);
  g.fillStyle=P.pool; g.fillRect(3*PX,3*PX,7*PX,5*PX);
  g.fillStyle=P.poolL; g.fillRect(4*PX,4*PX,8,2); g.fillRect(6*PX,6*PX,10,2);
  // resort fence
  g.fillStyle=P.rim;
  g.fillRect((EM-2)*PX,(EM-2)*PX,(S+4)*PX,3); g.fillRect((EM-2)*PX,(S+EM+2)*PX-3,(S+4)*PX,3);
  g.fillRect((EM-2)*PX,(EM-2)*PX,3,(S+4)*PX); g.fillRect((S+EM+2)*PX-3,(EM-2)*PX,3,(S+4)*PX);
  // ---- the pen itself, translated inside the resort
  g.save(); g.translate(EM*PX, EM*PX);
  for (var y=0;y<S;y++) for (var x=0;x<S;x++){        // stone floor
    var X=x*PX, Y=y*PX;
    g.fillStyle=((x+y)%2)?P.stone:P.stoneB; g.fillRect(X,Y,PX,PX);
    g.fillStyle=P.mortar; g.fillRect(X,Y+PX-1,PX,1); g.fillRect(X+PX-1,Y,1,PX);
    if (hash2(x+31,y+7)>0.92){ g.fillStyle=P.dust; g.fillRect(X+3,Y+4,5,3); }
  }
  g.fillStyle=P.wall;                                  // perimeter walls
  g.fillRect(0,0,S*PX,PX*2); g.fillRect(0,(S-2)*PX,S*PX,PX*2);
  g.fillRect(0,0,PX*2,S*PX); g.fillRect((S-2)*PX,0,PX*2,S*PX);
  g.fillStyle=P.wallTop;
  g.fillRect(0,0,S*PX,4); g.fillRect(0,0,4,S*PX);
  g.fillStyle=P.wallFace;                              // inner face: fake height
  g.fillRect(PX*2-3,PX*2-3,(S-4)*PX+6,3); g.fillRect(PX*2-3,PX*2-3,3,(S-4)*PX+6);
  g.fillRect(PX*2-3,(S-2)*PX,(S-4)*PX+6,3); g.fillRect((S-2)*PX,PX*2-3,3,(S-4)*PX+6);
  for (var i=4;i<S-6;i+=5){                            // nest-box apartments
    [[i,2],[i,S-4],[2,i],[S-4,i]].forEach(function(b){
      var X=b[0]*PX, Y=b[1]*PX;
      g.fillStyle=P.wallTop; g.fillRect(X,Y,PX*2,PX*2);
      g.fillStyle=P.wall; g.fillRect(X+2,Y+2,PX*2-4,PX*2-4);
      g.fillStyle=P.alcove; g.fillRect(X+PX-4,Y+PX-4,8,8);
    });
  }
  [[8,8],[S-10,8],[8,S-10],[S-10,S-10]].forEach(function(hp){  // hoppers
    var X=hp[0]*PX, Y=hp[1]*PX;
    g.fillStyle=P.shadow; g.fillRect(X+2,Y+PX*2-2,PX*2-2,2);
    g.fillStyle=P.hopper; g.fillRect(X,Y,PX*2,PX*2);
    g.fillStyle=P.hopperD;
    g.fillRect(X,Y+PX-1,PX*2,2); g.fillRect(X+PX-1,Y,2,PX*2);
    g.fillRect(X+4,Y+4,3,2); g.fillRect(X+PX+3,Y+PX+4,3,2);
  });
  g.fillStyle=P.trough; g.fillRect(((S>>1)-3)*PX,2*PX,6*PX,PX);  // water
  g.fillStyle=P.poolL;  g.fillRect(((S>>1)-3)*PX+4,2*PX+3,10,2);
  g.restore();
}

// =========================================================== compose + blit
function compose9(u, st){
  var terrain=SNAP ? (st.world&&st.world.terrain) : (worldInfo&&worldInfo.terrain);
  if (!terrain) return null;
  if (!base9 || terr9!==terrain) { buildBase9(terrain); semi9seq=-1; }
  if (semi9seq!==pollSeq){ buildSemi9(u); semi9seq=pollSeq; }
  var g=frame9.getContext("2d");
  g.drawImage(semi9,0,0);
  // winter buries the island; ice-age winters bury it deeper
  if (u.season==="winter"){
    var key=(u.harsh?"H":"W")+(u.iter||1);
    if (!snow9||snowKey!==key){ buildSnow9(u.harsh); snowKey=key; }
    g.drawImage(snow9,0,0);
  }
  g.fillStyle=P.waterL;                                   // living water
  for (var i=0;i<water9.length;i++){
    var w=water9[i];
    if ((w[0]+w[1]+(tick>>2))%9===0) g.fillRect(w[0]*PX+((w[0]+tick)>>1)%6, w[1]*PX+5, 6, 1);
  }
  // moored boats, bobbing on the tide
  g.fillStyle=P.trunk;
  for (var i=0;i<boats9.length;i++){
    var b=boats9[i], bob=((i+(tick>>3))%2);
    g.fillRect(b[0]*PX+1, b[1]*PX+5+bob, 10, 3);
    g.fillRect(b[0]*PX+5, b[1]*PX+bob, 1, 5);
  }
  // campfires flicker beside every hut once fire is tamed
  if ((u.tech||[]).indexOf("fire")>=0){
    (u.settlements||[]).forEach(function(s,i){
      var fx=(s.x+2)*PX, fy=(s.y+1)*PX, fl=((i+(tick>>1))%2);
      g.fillStyle=P.trunkD; g.fillRect(fx,fy+6,6,2);
      g.fillStyle=fl?"#e86820":"#f8a030"; g.fillRect(fx+1,fy+2,4,4);
      g.fillStyle=fl?"#f8d848":"#f8f0a0"; g.fillRect(fx+2,fy+ (fl?3:1),2,3);
    });
  }
  return frame9;
}
function compose6(u){
  if (!base6) buildBase6();
  var g=frame6.getContext("2d");
  g.drawImage(base6,0,0);
  return frame6;
}

// =========================================================== the people
// Figures are drawn in SCREEN space (not baked into the world canvas), so
// detail scales with the camera: zoom in and you see anatomy, tools and the
// work itself; zoom out to a crowd of hundreds and they simplify.
// Proportion is Vitruvian: 24 logical pixels tall, head exactly 1/8 of that,
// arm span equal to height. Motion is procedural — every joint is computed
// from a phase angle each frame, the way rotoscoped animation moves, never
// toggled between two frames.

var ACT_LABEL = ["idle","walking","foraging","hunting","fishing","farming",
                 "building","talking","together","giving birth",
                 "minding children","resting","eating","withdrawn","fighting"];
var A_WALK=1, A_FORAGE=2, A_HUNT=3, A_FISH=4, A_FARM=5, A_BUILD=6, A_TALK=7,
    A_MATE=8, A_BIRTH=9, A_TEND=10, A_REST=11, A_EAT=12, A_WITHDRAW=13,
    A_FIGHT=14;

var SKIN="#e8c49a", SKIN_D="#c0956a", SKIN_L="#f6e0c0";
var HAIRC=["#6b4a26","#2a1c10","#3a2414","#e2e2e2","#bfeae6"];
var TUNIC=["#e8c94e","#3f6fd8","#d45a8c","#9a9a9a","#9ae8e0"];
var TUNIC_D=["#bca031","#2e52a8","#a8406a","#787878","#74c2ba"];
var WOOD="#6b4226", BLADE="#b8bcc4";

var CXL=6;      // centre line of the 12-wide logical figure box

function lp(g,ox,oy,s,x,y,w,h){
  g.fillRect(ox+Math.round(x*s), oy+Math.round(y*s),
             Math.max(1,Math.round((w===undefined?1:w)*s)),
             Math.max(1,Math.round((h===undefined?1:h)*s)));
}
// a limb segment: stepped thick line between two joints
function limb(g,ox,oy,s,x1,y1,x2,y2,w){
  var dx=x2-x1, dy=y2-y1;
  var n=Math.max(2,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))*1.2));
  for (var i=0;i<=n;i++){
    lp(g,ox,oy,s, x1+dx*i/n-(w-1)/2, y1+dy*i/n, w, 1.1);
  }
}
// limb with a dark edge, so arms read against the torso — Prince of Persia
// kept its figures legible by silhouette, not by colour
var EDGE="#8d6844";
function limbE(g,ox,oy,s,x1,y1,x2,y2,w,color){
  g.fillStyle=EDGE; limb(g,ox,oy,s,x1,y1,x2,y2,w+0.85);
  g.fillStyle=color; limb(g,ox,oy,s,x1,y1,x2,y2,w);
}

// The pose solver: given an activity and a phase, where is every joint?
function solvePose(a, t){
  var ph = t*0.16 + a.id*1.7;
  var P = { shY:5, hipY:14, cx:0, lean:0, drop:0,     // body
            footLx:-1.6, footLy:24, footRx:1.6, footRy:24,
            kneeLx:-1.4, kneeLy:19.5, kneeRx:1.4, kneeRy:19.5,
            handLx:-3.4, handLy:14, handRx:3.4, handRy:14,
            elbLx:-3.6, elbLy:10, elbRx:3.6, elbRy:10,
            headTilt:0, tool:0, toolAng:0, carry:0, sit:0 };
  var act=a.act, sp=Math.sin(ph), cs=Math.cos(ph);

  if (a.moving){                                      // the walk cycle
    var stride=1.9, lift=1.7;
    var fwdL=sp, fwdR=-sp;
    P.footLx = fwdL*stride;    P.footLy = 24 - Math.max(0,fwdL)*lift;
    P.footRx = fwdR*stride;    P.footRy = 24 - Math.max(0,fwdR)*lift;
    // the lifting leg bends at the knee, the planted one stays straight
    P.kneeLx = fwdL*stride*0.35 - 0.3 + Math.max(0,fwdL)*1.0;
    P.kneeLy = 19.4 - Math.max(0,fwdL)*1.3;
    P.kneeRx = fwdR*stride*0.35 + 0.3 + Math.max(0,fwdR)*1.0;
    P.kneeRy = 19.4 - Math.max(0,fwdR)*1.3;
    P.handLx = -2.6 - sp*1.5;  P.handLy = 13.6 - Math.abs(sp)*0.5;
    P.handRx =  2.6 + sp*1.5;  P.handRy = 13.6 - Math.abs(sp)*0.5;
    P.elbLx  = -3.2 - sp*0.7;  P.elbRx = 3.2 + sp*0.7;
    P.elbLy  = 10 + Math.abs(sp)*0.4; P.elbRy = P.elbLy;
    P.drop   = -Math.abs(sp)*0.5;                     // body rises mid-stride
    P.lean   = 0.9;
    return P;
  }

  switch(act){
    case A_FORAGE: {                                  // bend, gather, rise
      var r=(Math.sin(ph*0.55)+1)/2;
      P.lean=2.2+r*1.1; P.drop=r*1.2;
      P.handLx=-2.0; P.handRx=2.6;
      P.handLy=18+r*3.4; P.handRy=18.5+r*3.6;
      P.elbLy=14; P.elbRy=14.4; P.headTilt=1.4;
      P.kneeLy=19.2; P.kneeRy=19.2;
      break;
    }
    case A_HUNT: {                                    // crouched, spear ready
      var th=Math.max(0,Math.sin(ph*0.5));            // thrust
      P.drop=1.3; P.lean=1.6;
      P.footLx=-2.4; P.footRx=2.2;
      P.kneeLx=-2.2; P.kneeLy=19.0; P.kneeRx=2.0; P.kneeRy=19.0;
      P.handRx=3.4+th*3.2; P.handRy=10.5;
      P.handLx=0.6+th*2.0; P.handLy=11.5;
      P.elbRx=3.0; P.elbRy=9.5; P.elbLx=1.4; P.elbLy=10;
      P.tool=1; P.toolAng=-0.15;
      break;
    }
    case A_FISH: {                                    // spear poised over water
      var st=Math.max(0,Math.sin(ph*0.35)-0.6)*2.5;
      P.lean=1.2;
      P.handRx=3.2; P.handRy=9.5+st*3;
      P.handLx=1.2; P.handLy=11+st*2;
      P.elbRx=3.4; P.elbRy=8.5; P.elbLx=2.0; P.elbLy=10;
      P.tool=1; P.toolAng=0.85;                       // angled down
      P.headTilt=1;
      break;
    }
    case A_FARM: {                                    // hoe: overhead to earth
      var sw=Math.sin(ph*0.6);
      var up=Math.max(0,sw), dn=Math.max(0,-sw);
      P.lean=1.0+dn*1.8; P.drop=dn*0.8;
      P.handRx=2.6+dn*2.2; P.handRy=7.5-up*3.5+dn*10;
      P.handLx=1.4+dn*1.6; P.handLy=9.5-up*2.5+dn*8;
      P.elbRx=3.4; P.elbRy=9-up*1.5; P.elbLx=2.2; P.elbLy=10.5;
      P.tool=2; P.toolAng=-1.1+dn*2.2;
      P.headTilt=dn*1.6;
      break;
    }
    case A_BUILD: {                                   // lift and set the beam
      var l=Math.max(0,Math.sin(ph*0.5));
      P.lean=0.8; P.drop=(1-l)*1.0;
      P.handLx=-2.4; P.handRx=2.4;
      P.handLy=12-l*5; P.handRy=12-l*5;
      P.elbLx=-3.2; P.elbRx=3.2; P.elbLy=10-l*3; P.elbRy=10-l*3;
      P.carry=1;
      break;
    }
    case A_TALK: {                                    // gesturing conversation
      var gse=Math.sin(ph*0.8);
      P.handRx=3.6+gse*0.8; P.handRy=11.5+gse*2.2;
      P.elbRx=3.6; P.elbRy=10;
      P.handLx=-3.0; P.handLy=14;
      P.headTilt=gse*0.5;
      break;
    }
    case A_MATE: {                                    // an embrace, and rhythm
      var r=Math.sin(ph*1.1);
      P.lean=1.6; P.drop=Math.abs(r)*0.5;
      P.handLx=-1.0; P.handLy=10; P.elbLx=-3.0; P.elbLy=9;
      P.handRx=4.2; P.handRy=10.5; P.elbRx=4.0; P.elbRy=9;
      P.footLx=-1.2; P.footRx=1.2;
      break;
    }
    case A_BIRTH: {                                   // kneeling, braced
      P.sit=1; P.shY=10; P.hipY=19.5;
      P.kneeLx=-2.4; P.kneeLy=23.2; P.kneeRx=2.4; P.kneeRy=23.2;
      P.footLx=-3.4; P.footLy=23.8; P.footRx=3.4; P.footRy=23.8;
      P.handLx=-2.4; P.handLy=17.5; P.handRx=2.4; P.handRy=17.5;
      P.elbLx=-3.6; P.elbLy=14; P.elbRx=3.6; P.elbRy=14;
      P.headTilt=1.8;
      break;
    }
    case A_TEND: {                                    // stooped to a child
      var r=(Math.sin(ph*0.4)+1)/2;
      P.lean=2.6; P.drop=1.6; P.headTilt=1.8;
      P.handLx=-1.2; P.handLy=18.5+r*1.2;
      P.handRx=2.8;  P.handRy=18.0+r*1.2;
      P.elbLy=14.5; P.elbRy=14.5;
      break;
    }
    case A_REST: {                                    // sitting on the ground
      var brz=Math.sin(ph*0.22)*0.3;
      P.sit=1; P.shY=11.5+brz; P.hipY=21.5;
      P.kneeLx=3.6; P.kneeLy=21.0; P.kneeRx=4.0; P.kneeRy=21.6;
      P.footLx=5.4; P.footLy=23.8; P.footRx=5.8; P.footRy=24;
      P.handLx=-2.8; P.handLy=21.5; P.handRx=1.4; P.handRy=21.8;
      P.elbLx=-3.4; P.elbLy=16.5; P.elbRx=3.0; P.elbRy=17;
      break;
    }
    case A_EAT: {                                     // hand to mouth
      var b=Math.max(0,Math.sin(ph*0.7));
      P.handRx=2.4-b*1.2; P.handRy=13-b*8.5;
      P.elbRx=3.6; P.elbRy=10.5;
      P.handLx=-3.0; P.handLy=14;
      P.headTilt=b*0.8;
      break;
    }
    case A_WITHDRAW: {                                // alone, grooming
      var gr=Math.sin(ph*0.3);
      P.handRx=1.4; P.handRy=10.5+gr*2.5;
      P.elbRx=3.2; P.elbRy=10.5;
      P.handLx=-2.6; P.handLy=13.5;
      P.headTilt=1.2;
      break;
    }
    case A_FIGHT: {                                   // lunge and recoil
      var l=Math.sin(ph*1.5);
      P.cx=l*1.8; P.lean=1.8+l*0.8;
      P.handRx=3.4+Math.max(0,l)*3.0; P.handRy=8.5;
      P.handLx=-1.6; P.handLy=9.5;
      P.elbRx=3.6; P.elbRy=8; P.elbLx=-3.2; P.elbLy=9;
      P.footLx=-2.6; P.footRx=2.4;
      break;
    }
    default: {                                        // standing, breathing
      var br=Math.sin(ph*0.25)*0.35;
      P.drop=br; P.handLy=14+br; P.handRy=14+br;
    }
  }
  return P;
}

function drawFigure(g, cxScreen, footScreen, s, a, clothed, t){
  var cls=a.cls, kid=(cls===0), eld=(cls===3), fem=(a.sex===1);
  var H=kid?16:24;
  var face=a.face||1;
  var P=solvePose(a,t);
  var ox=Math.round(cxScreen-CXL*s), oy=Math.round(footScreen-H*s+P.drop*s);
  var scaleY=H/24;
  function X(x){ return CXL + (P.cx + x)*face; }       // mirror about centre
  function Y(y){ return y*scaleY; }

  // ---- ground shadow
  g.fillStyle="rgba(0,0,0,0.26)";
  g.fillRect(ox+Math.round((CXL-2.5)*s), Math.round(footScreen-0.8*s),
             Math.max(2,Math.round(5*s)), Math.max(1,Math.round(1.2*s)));

  if (s<1.6){                    // a crowd seen from far off: compact, legible
    var bw=(fem?4.2:4.6), bx=CXL-bw/2;
    g.fillStyle=clothed?TUNIC[cls]:SKIN;
    lp(g,ox,oy,s, bx, Y(5.5), bw, Y(8.5));              // torso
    g.fillStyle=clothed?TUNIC_D[cls]:SKIN_D;
    lp(g,ox,oy,s, bx+bw-1.2, Y(5.5), 1.2, Y(8.5));      // shaded side
    lp(g,ox,oy,s, X(P.footLx*0.7)-0.9, Y(14), 1.8, Y(10));
    lp(g,ox,oy,s, X(P.footRx*0.7)-0.9, Y(14), 1.8, Y(10));
    g.fillStyle=SKIN;
    lp(g,ox,oy,s, CXL-1.6, Y(1.2), 3.2, Y(4.3));        // head
    g.fillStyle=eld?HAIRC[3]:(cls===4?HAIRC[4]:(fem?HAIRC[2]:HAIRC[1]));
    lp(g,ox,oy,s, CXL-1.8, Y(0.6), 3.6, Y(1.6));
    return;
  }

  var shW=kid?2.0:(fem?2.5:3.2);                       // half-widths
  var hpW=kid?2.0:(fem?3.2:2.4);
  var tun=TUNIC[cls], tunD=TUNIC_D[cls];
  var leanX=P.lean*face*0.85;

  // ---- legs (hip -> knee -> foot), far leg first
  limbE(g,ox,oy,s, X(-hpW*0.55), Y(P.hipY), X(P.kneeLx), Y(P.kneeLy), 1.5, SKIN_D);
  limbE(g,ox,oy,s, X(P.kneeLx), Y(P.kneeLy), X(P.footLx), Y(P.footLy), 1.3, SKIN_D);
  limbE(g,ox,oy,s, X(hpW*0.55), Y(P.hipY), X(P.kneeRx), Y(P.kneeRy), 1.6, SKIN);
  limbE(g,ox,oy,s, X(P.kneeRx), Y(P.kneeRy), X(P.footRx), Y(P.footRy), 1.4, SKIN);

  // ---- torso: shoulders taper to waist, flare to hips
  var tTop=Y(P.shY), tBot=Y(P.hipY);
  var rows=Math.max(3,Math.round((P.hipY-P.shY)*scaleY*1.1));
  for (var i=0;i<rows;i++){
    var f=i/(rows-1);
    var w = shW + (hpW-shW)*Math.pow(f,1.6);
    if (f<0.55) w = shW - (shW-Math.min(shW,hpW)*0.78)*(f/0.55)*0.42;  // waist
    var yy = tTop + (tBot-tTop)*f;
    var xx = X(-w) + leanX*(1-f);
    var ww = w*2;
    if (clothed && f>0.08){
      g.fillStyle = (fem && f>0.62) ? tun : tun;
      g.fillRect(ox+Math.round(xx*s), oy+Math.round(yy*s),
                 Math.max(1,Math.round(ww*s)), Math.max(1,Math.round(1.15*s)));
      g.fillStyle = tunD;                              // shaded side
      g.fillRect(ox+Math.round((xx+ww-0.9)*s), oy+Math.round(yy*s),
                 Math.max(1,Math.round(0.9*s)), Math.max(1,Math.round(1.15*s)));
    } else {
      g.fillStyle = SKIN;
      g.fillRect(ox+Math.round(xx*s), oy+Math.round(yy*s),
                 Math.max(1,Math.round(ww*s)), Math.max(1,Math.round(1.15*s)));
      g.fillStyle = SKIN_D;
      g.fillRect(ox+Math.round((xx+ww-0.8)*s), oy+Math.round(yy*s),
                 Math.max(1,Math.round(0.8*s)), Math.max(1,Math.round(1.15*s)));
    }
  }

  // ---- the body as it is, before anyone thought to cover it
  if (!clothed && !kid && s>=3){
    g.fillStyle=SKIN_D;
    if (fem){
      lp(g,ox,oy,s, X(-shW+0.2)+leanX*0.6, Y(7.2), 1.0, Y(1.2));
      lp(g,ox,oy,s, X(shW-1.2)+leanX*0.6,  Y(7.2), 1.0, Y(1.2));
      lp(g,ox,oy,s, X(-0.5), Y(14.6), 1.0, Y(1.0));
    } else {
      lp(g,ox,oy,s, X(-0.4), Y(14.4), 0.9, Y(1.8));
    }
    g.fillStyle="rgba(120,86,56,0.55)";                // navel
    lp(g,ox,oy,s, X(-0.3)+leanX*0.3, Y(11.5), 0.7, Y(0.7));
  }

  // ---- arms (shoulder -> elbow -> hand), outlined so they read on the body
  limbE(g,ox,oy,s, X(-shW+0.3)+leanX, Y(P.shY+0.6), X(P.elbLx), Y(P.elbLy), 1.2, SKIN_D);
  limbE(g,ox,oy,s, X(P.elbLx), Y(P.elbLy), X(P.handLx), Y(P.handLy), 1.1, SKIN_D);
  limbE(g,ox,oy,s, X(shW-0.3)+leanX, Y(P.shY+0.6), X(P.elbRx), Y(P.elbRy), 1.3, SKIN);
  limbE(g,ox,oy,s, X(P.elbRx), Y(P.elbRy), X(P.handRx), Y(P.handRy), 1.2, SKIN);

  // ---- tools and burdens
  if (P.tool===1){                                     // spear
    var ang=P.toolAng, L=11;
    var hx=X(P.handRx), hy=Y(P.handRy);
    var tx2=hx+Math.cos(ang)*L*face, ty2=hy+Math.sin(ang)*L;
    g.fillStyle=WOOD; limb(g,ox,oy,s, hx-Math.cos(ang)*3*face, hy-Math.sin(ang)*3,
                           tx2, ty2, 1.0);
    g.fillStyle=BLADE; limb(g,ox,oy,s, tx2-Math.cos(ang)*1.6*face,
                            ty2-Math.sin(ang)*1.6, tx2, ty2, 1.4);
  } else if (P.tool===2){                              // hoe
    var ang2=P.toolAng, L2=9;
    var hx2=X(P.handRx), hy2=Y(P.handRy);
    var ex=hx2+Math.cos(ang2)*L2*face, ey=hy2+Math.sin(ang2)*L2;
    g.fillStyle=WOOD; limb(g,ox,oy,s, hx2, hy2, ex, ey, 1.0);
    g.fillStyle=BLADE; lp(g,ox,oy,s, ex-1, ey-0.5, 2.4, 1.4);
  }
  if (P.carry){                                        // a beam, held out front
    var bx0=Math.min(X(P.handRx),X(P.handRx+5.5*face))-0.4;
    g.fillStyle=EDGE; lp(g,ox,oy,s, bx0-0.4, Y(P.handRy)-1.4, 6.4, 2.6);
    g.fillStyle=WOOD; lp(g,ox,oy,s, bx0, Y(P.handRy)-1.0, 5.6, 1.8);
    g.fillStyle="#52321c"; lp(g,ox,oy,s, bx0, Y(P.handRy)+0.4, 5.6, 0.5);
  }

  // ---- neck, head, hair — the head is exactly one eighth of the figure
  var hw=kid?2.3:2.7, hh=Y(3.0);
  var hx3=X(-hw/2)+leanX*1.15+P.headTilt*face*0.45;
  var hy3=Y(P.shY-4.0)+P.headTilt*0.35;
  g.fillStyle=SKIN_D;                                  // neck
  lp(g,ox,oy,s, hx3+hw*0.25, hy3+hh*0.85, hw*0.5, Y(1.3));
  g.fillStyle=EDGE;                                    // skull outline
  lp(g,ox,oy,s, hx3-0.35, hy3-0.35, hw+0.7, hh+0.7);
  g.fillStyle=SKIN;
  lp(g,ox,oy,s, hx3, hy3, hw, hh);
  g.fillStyle=SKIN_D;                                  // cheek shadow
  lp(g,ox,oy,s, hx3+hw-0.7, hy3+0.4, 0.7, hh-0.4);
  g.fillStyle=eld?HAIRC[3]:(cls===4?HAIRC[4]:(fem?HAIRC[2]:HAIRC[1]));
  lp(g,ox,oy,s, hx3-0.25, hy3-0.4, hw+0.5, Y(1.0));    // crown
  if (fem && !kid){                                    // hair past the jaw
    lp(g,ox,oy,s, hx3-0.5, hy3-0.1, 0.75, hh*0.95);
    lp(g,ox,oy,s, hx3+hw-0.25, hy3-0.1, 0.75, hh*0.95);
  } else if (!kid && !eld){
    lp(g,ox,oy,s, hx3-0.25, hy3-0.1, hw+0.5, Y(0.5));
  }
  if (s>=3){                                           // an eye, facing forward
    g.fillStyle="#3a2a1c";
    lp(g,ox,oy,s, hx3+(face>0?hw-1.15:0.45), hy3+1.1, 0.65, 0.65);
  }
}

// ---- actors: the people keep living between observations ----------------
// The engine reports where each person is and what they are doing; snapshots
// arrive every 2s locally and every few minutes on the mirror. Actors tween
// toward each new observation and keep performing their activity in between,
// so the world is continuous rather than a slideshow.
var actors6={}, actors9={};
function syncActors(map, people, ox){
  var seen={};
  (people||[]).forEach(function(p,i){
    var id=p.length>4?p[4]:i, sex=p.length>3?p[3]:(p[2]===2?1:0);
    var act=p.length>5?p[5]:0;
    seen[id]=1;
    var nx=p[0]+ox, ny=p[1]+ox;
    var a=map[id];
    if (!a){ map[id]=a={x:nx,y:ny,id:id,face:1,moving:false}; }
    a.cls=p[2]; a.sex=sex; a.act=act;
    a.tx=nx; a.ty=ny;                      // where the engine says they are
  });
  Object.keys(map).forEach(function(id){ if(!seen[id]) delete map[id]; });
}
function updateActors(map){
  Object.keys(map).forEach(function(id){
    var a=map[id];
    var dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if (d>0.06){
      var sp=Math.min(0.10, d*0.35);       // walk, don't teleport
      a.x+=dx/d*sp; a.y+=dy/d*sp;
      a.moving=true;
      if (Math.abs(dx)>0.15) a.face = dx>0?1:-1;
    } else {
      a.x=a.tx; a.y=a.ty; a.moving=false;
    }
  });
}
// Two people doing something together should face each other.
function pairFacing(list){
  var cell={};
  for (var i=0;i<list.length;i++){
    var a=list[i];
    if (a.act!==A_MATE && a.act!==A_TALK && a.act!==A_FIGHT) continue;
    var k=Math.round(a.x)+","+Math.round(a.y);
    (cell[k]||(cell[k]=[])).push(a);
  }
  Object.keys(cell).forEach(function(k){
    var pair=cell[k];
    if (pair.length<2) return;
    pair.sort(function(p,q){return p.id-q.id;});
    pair[0].face=1;  pair[0].nudge=-0.22;
    pair[1].face=-1; pair[1].nudge=0.22;
    for (var j=2;j<pair.length;j++){ pair[j].nudge=(j%2?0.4:-0.4); }
  });
}

function render(canvas, composed, map, key, u){
  if (!composed) return;
  var S=composed.width/PX, c=cam[key];
  updateActors(map);
  var list=[], minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  Object.keys(map).forEach(function(id){
    var a=map[id]; list.push(a); a.nudge=0;
    if(a.x<minx)minx=a.x; if(a.x>maxx)maxx=a.x;
    if(a.y<miny)miny=a.y; if(a.y>maxy)maxy=a.y;
  });
  var tx,ty,th;
  if (list.length){
    tx=(minx+maxx)/2; ty=(miny+maxy)/2;
    th=Math.max(7, Math.min(S/2, Math.max(maxx-minx,maxy-miny)/2+6));
  } else { tx=S/2; ty=S/2; th=S/2; }
  c.x=lerp(c.x,tx,0.04); c.y=lerp(c.y,ty,0.04); c.h=lerp(c.h,th,0.04);
  var aspect=canvas.width/canvas.height;
  var hy=c.h, hx=Math.min(S/2, c.h*aspect);
  if (hx/aspect<hy) hy=hx/aspect;
  var sx=Math.max(0,Math.min(S-2*hx,c.x-hx)), sy=Math.max(0,Math.min(S-2*hy,c.y-hy));

  var g=canvas.getContext("2d");
  g.imageSmoothingEnabled=false;
  g.fillStyle="#000"; g.fillRect(0,0,canvas.width,canvas.height);
  g.drawImage(composed, sx*PX, sy*PX, 2*hx*PX, 2*hy*PX, 0, 0, canvas.width, canvas.height);

  // people are drawn here, in screen space, so detail follows the zoom
  // a person stands about 1.35 tiles tall; crisp integer pixels when zoomed in
  var tileScreen=canvas.width/(2*hx);
  var sRaw=tileScreen*1.35/24;
  var s=sRaw>=2 ? Math.round(sRaw) : Math.max(0.42, sRaw);
  var clothed = key==="e" ? true
              : !!(u && u.tech && u.tech.indexOf("shelter")>=0);
  pairFacing(list);
  list.sort(function(a,b){ return a.y-b.y; });
  for (var i=0;i<list.length;i++){
    var a=list[i];
    var px=(a.x+(a.nudge||0)-sx)*tileScreen, py=(a.y-sy)*tileScreen;
    if (px<-60||py<-80||px>canvas.width+60||py>canvas.height+60) continue;
    drawFigure(g, px+tileScreen/2, py+tileScreen*0.95, s, a, clothed, tick);
  }
}

// =========================================================== god panel
function sparkline(id, census, color){
  var cv=document.getElementById(id);
  if (!cv || !census || census.length<2) return;
  var g=cv.getContext("2d"), W=cv.width=cv.clientWidth||200, H=cv.height=44;
  g.fillStyle="#07070e"; g.fillRect(0,0,W,H);
  var max=1; census.forEach(function(r){ if(r[1]>max)max=r[1]; });
  var n=census.length, bw=Math.max(1,Math.floor(W/n));
  g.fillStyle=color;
  for (var i=0;i<n;i++){
    var h=Math.max(1,Math.round(census[i][1]/max*(H-4)));
    g.fillRect(i*bw, H-h, Math.max(1,bw-1), h);
  }
}
function doingHTML(people){
  if (!people||!people.length) return "";
  var tally={}, n=0;
  for (var i=0;i<people.length;i++){
    var act=people[i].length>5?people[i][5]:0;
    tally[act]=(tally[act]||0)+1; n++;
  }
  var rows=Object.keys(tally).map(function(k){ return [ACT_LABEL[k]||"?", tally[k]]; });
  rows.sort(function(a,b){ return b[1]-a[1]; });
  return "<span class='dim'>RIGHT NOW: "
    + rows.slice(0,5).map(function(r){ return r[1]+" "+r[0]; }).join(" · ")
    + "</span>\n";
}
function statHTML(u, kind){
  var out="<h2>UNIVERSE "+(kind==="e"?"6 · EDEN":"9 · LAGOON")+"</h2>";
  out+="ITERATION "+u.iter+" · YEAR "+u.year+"\n";
  out+="POP "+u.pop+" · PEAK "+u.peak+" · GEN "+u.gen+"\n";
  out+=doingHTML(u.people);
  out+="<canvas id='tr"+kind+"' class='trend'></canvas>";
  if (kind==="e"){
    out+="PHASE: "+u.phase.toUpperCase();
    if (u.std) out+="\n<span class='dim'>OUTBREAK IN THE PEN</span>";
    if (u.ennui>0.2) out+="\n<span class='dim'>ENNUI "+Math.round(u.ennui*100)+"%</span>";
  } else {
    var age=u.tech&&u.tech.length?("AGE OF "+u.tech[u.tech.length-1].replace("_"," ").toUpperCase()):u.phase.toUpperCase();
    out+=age+" · TRIBES "+((u.settlements||[]).length)+" · STORE "+Math.round(u.store||0);
    if (u.season==="winter") out+="\n"+(u.harsh?"AN ICE-AGE WINTER":"WINTER");
    else if (u.dry) out+="\nDROUGHT";
    if (u.lessons&&u.lessons.length) out+="\n<span class='dim'>INSTINCTS: "+u.lessons.join(" · ").toUpperCase()+"</span>";
    if (u.culture&&u.culture.length) out+="\n<span class='dim'>ARTS: "+u.culture.length+" — "+u.culture[u.culture.length-1].toUpperCase()+"</span>";
  }
  return out;
}
function hudText(u, kind){
  var l2 = kind==="e" ? u.phase.toUpperCase()
    : (u.tech&&u.tech.length?"AGE OF "+u.tech[u.tech.length-1].replace("_"," ").toUpperCase():u.phase.toUpperCase());
  return "<b>UNIVERSE "+(kind==="e"?"6 · EDEN":"9 · LAGOON")+"</b>  Y"+u.year+" · POP "+u.pop+" · "+l2;
}
var typeFull="", typePos=0, shown=[];
function updateRecords(events){
  var el=document.getElementById("reclines");
  if (!events||!events.length){ el.innerHTML="<span class='dim'>Nothing yet. The worlds are young.</span>"; return; }
  var last=events[events.length-1], key=last.d+last.msg;
  if (typeFull!==key){ typeFull=key; typePos=0; shown=events.slice(-7,-1); }
  typePos=Math.min(last.msg.length, typePos+2);
  function row(e,cur){
    var cls=e.u==="EDEN"?"ev6":"ev9";
    return "<div class='"+cls+(cur?" cur":"")+"'><span class='evy'>Y"+e.y+" "
      +(e.u==="EDEN"?"U6":"U9")+"</span> "+(cur?last.msg.slice(0,typePos):e.msg)+"</div>";
  }
  el.innerHTML=shown.map(function(e){return row(e,false);}).join("")+row(last,true);
}

// =========================================================== loops
function fit(){
  var dpr=Math.min(window.devicePixelRatio||1, 3);
  ["c6","c9"].forEach(function(id){
    var cv=document.getElementById(id);
    cv.width=Math.round(cv.clientWidth*dpr);
    cv.height=Math.round(cv.clientHeight*dpr);
  });
}
window.addEventListener("resize", fit);

function loadWorld(){
  if (SNAP) return Promise.resolve();
  return fetchJSON("/world").then(function(w){ worldInfo=w; lagoonIter=w.lagoon_iter; });
}
function poll(){
  (SNAP?fetchJSON(SNAP):fetchJSON("/state")).then(function(st){
    state=st; pollSeq++;
    if (!SNAP&&worldInfo&&st.u.lagoon.iter!==lagoonIter) loadWorld().then(function(){ base9=null; });
    syncActors(actors6, st.u.eden.people, EM);
    syncActors(actors9, st.u.lagoon.people, 0);
    var e=st.u.eden,l=st.u.lagoon;
    var extra="";
    if (st.status&&st.status.catching_up) extra="  ·  FAST-FORWARDING "+st.status.behind_days+" DAYS";
    else if (SNAP){
      var age=Math.max(0,Math.round(Date.now()/1000-st.wall));
      extra="  ·  OBSERVED "+(age<90?age+"S":Math.round(age/60)+" MIN")+" AGO";
    }
    document.getElementById("hud6").innerHTML=hudText(e,"e")+extra;
    document.getElementById("hud9").innerHTML=hudText(l,"l");
    document.getElementById("s6").innerHTML=statHTML(e,"e");
    document.getElementById("s9").innerHTML=statHTML(l,"l");
    sparkline("tre", e.census, "#a8c0f0");
    sparkline("trl", l.census, "#a0e898");
  }).catch(function(){});
}
function frame(){
  // Driven by setInterval, not requestAnimationFrame: rAF is suspended in a
  // hidden tab and never re-arms a chained loop, which would leave the world
  // frozen on return. We simply skip the work while nobody is looking.
  if (document.hidden) return;
  tick++;
  if (state){
    render(document.getElementById("c6"), compose6(state.u.eden), actors6, "e", state.u.eden);
    render(document.getElementById("c9"), compose9(state.u.lagoon, state), actors9, "l", state.u.lagoon);
    if (tick%3===0) updateRecords(state.events);
  }
}
document.addEventListener("visibilitychange", function(){
  if (!document.hidden){ fit(); frame(); }      // repaint the moment they return
});
fit();
loadWorld().then(function(){
  poll(); setInterval(poll,2000);
  frame(); setInterval(frame,100);
});
</script>
