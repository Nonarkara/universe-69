<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>UNIVERSE 69</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#cfcfcf; font-family:Menlo,Monaco,monospace;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  h1 { font-size:14px; letter-spacing:6px; color:#888; margin:14px 0 2px; font-weight:normal; }
  #sub { font-size:10px; color:#555; margin-bottom:10px; letter-spacing:2px; }
  #panels { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .panel { border:2px solid #333; background:#000; }
  .hud { font-size:10px; padding:5px 7px; border-bottom:2px solid #333;
         display:flex; justify-content:space-between; white-space:pre; }
  .hud .uname { color:#fff; }
  canvas { display:block; image-rendering:pixelated; }
  #ticker { width:min(96vw, 1000px); margin:12px 0 20px; border:2px solid #333;
            background:#000; padding:6px 8px; font-size:10px; line-height:1.7;
            height:132px; overflow:hidden; }
  .ev6 { color:#bfcfe8; } .ev9 { color:#9fd39a; }
  .evy { color:#666; }
  #ff { color:#e8c84a; font-size:10px; height:14px; margin-bottom:4px; letter-spacing:1px; }
</style>
</head>
<body>
<h1>UNIVERSE 69</h1>
<div id="sub">TWO SEALED WORLDS &middot; THE OBSERVERS ONLY WATCH</div>
<div id="ff"></div>
<div id="panels">
  <div class="panel">
    <div class="hud"><span class="uname">UNIVERSE 6 &middot; EDEN</span><span id="hud6"></span></div>
    <canvas id="c6" width="480" height="480"></canvas>
  </div>
  <div class="panel">
    <div class="hud"><span class="uname">UNIVERSE 9 &middot; LAGOON</span><span id="hud9"></span></div>
    <canvas id="c9" width="480" height="480"></canvas>
  </div>
</div>
<div id="ticker"></div>

<script src="config.js"></script>
<script>
// SNAPSHOT_URL is set by config.js on the web mirror; locally we talk to the sim.
var SNAP = window.SNAPSHOT_URL || null;

var PEOPLE_COLORS = ["#f2d94e","#4e7ad1","#d1618f","#9a9a9a","#7fe8e0"];
// 0 child, 1 man, 2 woman, 3 elder, 4 withdrawn ("beautiful ones")
var TERRAIN_COLORS = ["#4a8f3c","#2c6b2a","#2e6fb8","#d9c37a","#8a6b35"];

var worldInfo = null, lagoonIter = -1;
var off6 = document.createElement("canvas");
var off9 = document.createElement("canvas");
var cam = { e: {x:24, y:24, h:9}, l: {x:58, y:52, h:9} };

function lerp(a,b,t){ return a + (b-a)*t; }

function fetchJSON(url){ return fetch(url, {cache:"no-store"}).then(r=>r.json()); }

function loadWorld(){
  if (SNAP) return Promise.resolve();            // snapshot embeds the world
  return fetchJSON("/world").then(function(w){ worldInfo = w; lagoonIter = w.lagoon_iter; });
}

function drawEdenBase(ctx, S){
  ctx.fillStyle = "#cfc6b8"; ctx.fillRect(0,0,S,S);          // pen floor
  ctx.fillStyle = "#6b5f52";                                  // walls
  ctx.fillRect(0,0,S,1); ctx.fillRect(0,S-1,S,1);
  ctx.fillRect(0,0,1,S); ctx.fillRect(S-1,0,1,S);
  ctx.fillStyle = "#e8c84a";                                  // food hoppers
  [[3,3],[S-5,3],[3,S-5],[S-5,S-5]].forEach(function(h){ ctx.fillRect(h[0],h[1],2,2); });
  ctx.fillStyle = "#4a90d9";                                  // water troughs
  ctx.fillRect((S>>1)-1, 1, 2, 1); ctx.fillRect((S>>1)-1, S-2, 2, 1);
}

function drawLagoonBase(ctx, S, terrain){
  for (var y=0; y<S; y++) for (var x=0; x<S; x++){
    ctx.fillStyle = TERRAIN_COLORS[terrain[y][x]];
    ctx.fillRect(x,y,1,1);
  }
}

function render(canvas, offc, u, kind, st){
  var S = offc.width, ctx = offc.getContext("2d");
  if (kind === "e"){ drawEdenBase(ctx, S); }
  else {
    var terrain = SNAP ? st.world.terrain : worldInfo.terrain;
    drawLagoonBase(ctx, S, terrain);
    (u.farms||[]).forEach(function(f){
      ctx.fillStyle = TERRAIN_COLORS[4];
      ctx.fillRect(Math.max(0,Math.min(S-1,f[0])), Math.max(0,Math.min(S-1,f[1])), 1, 1);
    });
    (u.settlements||[]).forEach(function(s){                 // huts
      ctx.fillStyle = "#7a4e2a"; ctx.fillRect(s.x-1, s.y-1, 2, 2);
    });
  }
  // people
  var minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
  u.people.forEach(function(p){
    ctx.fillStyle = PEOPLE_COLORS[p[2]];
    ctx.fillRect(p[0], p[1], 1, 1);
    if (p[0]<minx)minx=p[0]; if (p[0]>maxx)maxx=p[0];
    if (p[1]<miny)miny=p[1]; if (p[1]>maxy)maxy=p[1];
  });
  // camera follows the population spread, zooming out as it grows
  var c = cam[kind === "e" ? "e" : "l"];
  var tx, ty, th;
  if (u.people.length){
    tx = (minx+maxx)/2; ty = (miny+maxy)/2;
    th = Math.max(9, Math.min(S/2, Math.max(maxx-minx, maxy-miny)/2 + 7));
  } else { tx = S/2; ty = S/2; th = S/2; }
  c.x = lerp(c.x, tx, 0.08); c.y = lerp(c.y, ty, 0.08); c.h = lerp(c.h, th, 0.08);
  var h = c.h, sx = Math.max(0, Math.min(S-2*h, c.x-h)), sy = Math.max(0, Math.min(S-2*h, c.y-h));
  var g = canvas.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.fillStyle = "#000"; g.fillRect(0,0,canvas.width,canvas.height);
  g.drawImage(offc, sx, sy, 2*h, 2*h, 0, 0, canvas.width, canvas.height);
}

function hud(u, extra){
  return "IT " + u.iter + "  Y" + u.year + "  POP " + u.pop +
         "  GEN " + u.gen + "  PK " + u.peak + "\n" + (extra || u.phase).toUpperCase();
}

function tickerHTML(events){
  return events.slice(-8).reverse().map(function(e){
    var cls = e.u === "EDEN" ? "ev6" : "ev9";
    var tag = e.u === "EDEN" ? "U6" : "U9";
    return "<div class='"+cls+"'><span class='evy'>Y"+e.y+" "+tag+"</span> "+e.msg+"</div>";
  }).join("");
}

function update(){
  var p = SNAP ? fetchJSON(SNAP) : fetchJSON("/state");
  p.then(function(st){
    var e = st.u.eden, l = st.u.lagoon;
    if (SNAP && st.world){ off9.width = off9.height = st.world.lagoon_size; }
    if (!SNAP && worldInfo && l.iter !== lagoonIter){ return loadWorld(); } // reseeded: new terrain
    document.getElementById("hud6").textContent = hud(e);
    document.getElementById("hud9").textContent =
      hud(l, (l.tech && l.tech.length ? "AGE OF " + l.tech[l.tech.length-1].replace("_"," ") : l.phase));
    render(document.getElementById("c6"), off6, e, "e", st);
    render(document.getElementById("c9"), off9, l, "l", st);
    document.getElementById("ticker").innerHTML = tickerHTML(st.events || []);
    var ff = document.getElementById("ff");
    if (st.status && st.status.catching_up)
      ff.textContent = "FAST-FORWARDING — " + st.status.behind_days + " DAYS BEHIND THE CLOCK";
    else if (SNAP)
      ff.textContent = "MIRROR · LAST OBSERVED " + new Date(st.wall*1000).toLocaleString();
    else ff.textContent = "";
  }).catch(function(){ document.getElementById("ff").textContent = "SIGNAL LOST — RETRYING"; });
}

off6.width = off6.height = 48;
off9.width = off9.height = 96;
loadWorld().then(function(){ update(); setInterval(update, 2000); });
</script>
</body>
</html>
